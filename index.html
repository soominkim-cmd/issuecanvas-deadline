case 'add-close': { const ok = S.add && S.add.result && !S.add.result.err; $('#add').close(); if (ok) { S.add = null; if (S.route !== 'schedule') go('schedule'); else render(); } break; }
case 'add-more': S.add = { tab: S.add.tab, text: '', cards: [], batch: null, result: null, saving: false }; if (S.add.tab === 'single') S.add.single = blankCard(); renderAdd(); setTimeout(() => ($('#add-text') || $('#add [data-f="title"]'))?.focus(), 30); break;
case 'add-tab': S.add.tab = id; if (id === 'single' && !S.add.single) S.add.single = blankCard(); S.add.result = null; renderAdd(); break;
case 'add-parse': doParse(); break;
case 'add-save': saveAdd(); break;
case 'preset': { const [k, ad, l] = id.split('|'), c = S.add.single; applyField(c, 'category', k); setTmode(c, ad === '1' ? 'all_day' : (c.tmode === 'all_day' ? 'timed' : c.tmode || 'timed')); if (!c.title.trim()) c.title = l; c.participants = c.participants.length ? c.participants : [S.me.id]; renderAdd(); break; }
case 'card-ex': { const card = el.closest('.rcard'), [c, mode] = cardFromEl(card); c.excluded = !c.excluded; refreshCard(card, c, mode); break; }
case 'card-fix': {
const card = el.closest('.rcard'), [c, mode] = cardFromEl(card);
if (id === 'date-ok') c.dateOk = true; if (id === 'type-ok') c.typeOk = true; if (id === 'dup-ok') c.dupOk = true; if (id === 'nextday') c.nextDay = true;
if (id === 'allday') { setTmode(c, 'all_day'); mode === 'edit' ? renderDrawer() : renderAdd(); break; }
if (id === 'undecided') { setTmode(c, 'undecided'); mode === 'edit' ? renderDrawer() : renderAdd(); break; }
if (id === 'startonly') { setTmode(c, 'start_only'); mode === 'edit' ? renderDrawer() : renderAdd(); break; }
refreshCard(card, c, mode); break;
}
/* 알림 */
case 'nfilter': S.nfilter = id; render(); break;
/* Slack 수집 */
case 'sl-filter': S.slf = id; render(); break;
case 'sl-toggle': S.slOpen = !(S.slOpen == null ? S.slack.some(r => slState(r) === 'review') : S.slOpen); render(); break;
case 'sl-confirm': case 'sl-ignore': {
el.disabled = true;
const { data, error } = await sb.rpc('slack_review_action', { p_msg: +id, p_action: a === 'sl-confirm' ? 'confirm' : 'ignore' });
if (error) { el.disabled = false; toast({ forbidden: '처리할 권한이 없어요.', incomplete: '빠진 정보가 있어요. Slack에서 수정해 주세요.', no_target: '대상 일정을 정하지 못했어요. Slack에서 골라 주세요.' }[error.message] || '처리하지 못했어요. 다시 시도해 주세요.'); break; }
toast(a === 'sl-ignore' ? '무시했어요' : data && data.already ? '이미 처리된 메시지예요' : '반영했어요');
await Promise.all([loadSlack(), loadEvents()]); render(); break;
}
case 'sl-chopen': S.slChOpen = !S.slChOpen; render(); break;
case 'sl-ch': {
const c = S.slackCh.find(x => x.channel_id === id), k = el.dataset.k;
if (!c) break;
const { error } = await sb.rpc('set_slack_settings', { p: { channel: { id, [k]: !c[k] } } });
if (error) { toast('설정을 바꾸지 못했어요'); break; }
await loadSlack(); render(); break;
}
case 'sl-auto': {
const on = !(S.slackSet && S.slackSet.auto_register);
const { error } = await sb.rpc('set_slack_settings', { p: { auto_register: on } });
if (error) { toast('설정을 바꾸지 못했어요'); break; }
await loadSlack(); render(); toast(on ? '자동 등록을 켰어요' : '자동 등록을 껐어요 (Shadow Mode)'); break;
}
case 'notif-all': await sb.rpc('mark_notifications_read', { p_ids: null }); await loadNotifs(); render(); break;
case 'notif': {
const n = S.notifs.find(x => String(x.id) === id);
if (n && !n.read_at) { n.read_at = new Date().toISOString(); sb.rpc('mark_notifications_read', { p_ids: [n.id] }).then(() => loadNotifs()).then(renderSide); }
if (n && n.event_id && S.events.some(x => x.id === n.event_id)) openEvent(n.event_id); else { toast('이 일정은 더 이상 볼 수 없어요.'); render(); }
break;
}
/* 설정 */
case 'avatar-clear': { const { error } = await sb.rpc('update_my_profile', { p: { avatar: '' } }); if (!error) { await loadMembers(); render(); toast('사진을 지웠어요'); } break; }
case 'logout': await sb.auth.signOut(); location.hash = ''; location.reload(); break;
}
});
$('#add').addEventListener('close', () => { if (S.add && S.add.result && !S.add.result.err) S.add = null; });
function scrollPanel() { if (innerWidth <= 1180) { const p = $('#panel'); if (p) p.scrollIntoView({ block: 'start', behavior: 'smooth' }); } }

/* ---------- 로그인과 시작 ---------- */
function showLogin(msg) {
const box = $('#login'); box.hidden = false;
const err = $('#l-err'); if (msg) { err.textContent = msg; err.hidden = false; }
let last = ''; try { last = localStorage.getItem('ic-last-id') || ''; } catch (e) {}
if (last && !$('#l-id').value) $('#l-id').value = last;
setTimeout(() => (last ? $('#l-pass') : $('#l-id')).focus(), 30);
}
$('#l-form').addEventListener('submit', async ev => {
ev.preventDefault();
const err = $('#l-err'), btn = $('#l-btn'); err.hidden = true; btn.disabled = true;
const login = $('#l-id').value.trim().toLowerCase(), password = $('#l-pass').value;
const { data, error } = await sb.auth.signInWithPassword({ email: login + MAIL, password });
btn.disabled = false;
if (error) {
err.textContent = /banned/i.test(error.message) ? '이전 공용 계정은 더 이상 쓸 수 없어요. 개인 아이디로 로그인하세요.' : /invalid/i.test(error.message) ? '아이디 또는 비밀번호가 맞지 않아요.' : '로그인하지 못했어요. 잠시 후 다시 시도하세요.';
err.hidden = false; return;
}
try { localStorage.setItem('ic-last-id', login); } catch (e) {}
$('#login').hidden = true; start(data.session);
});
async function start(session) {
try { await withTimeout(loadMembers(), 8000); } catch (e) { S.members = []; }
const me = S.members.find(m => m.id === session.user.id);
if (!me) { await dropSession(); showLogin('다시 로그인해 주세요. 개인 아이디로 로그인하세요.'); return; }
S.me = me;
const h = legacy(location.hash.slice(1)); if (ROUTE_RE.test(h)) S.route = h;
render();
const timer = setTimeout(() => { if (S.load === 'loading') { S.load = 'slow'; render(); } }, 10000);
try { await Promise.all([loaders.docs(), loadEvents(), loadNotifs(), loadSlack().catch(() => {}), loadWork().catch(() => {}), loadSeries().catch(() => {})]); S.load = 'ok'; }
catch (e) { S.load = 'error'; }
clearTimeout(timer); render(); subscribe();
}
S.month = today().slice(0, 7); S.week = weekStart(today()); S.calMonth = S.month; S.avDay = today();
function withTimeout(p, ms) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]); }
async function dropSession() {
try { await withTimeout(sb.auth.signOut({ scope: 'local' }), 3000); } catch (e) {}
try { Object.keys(localStorage).filter(k => k.startsWith('sb-')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
}
(async () => {
if (!sb) { $('#main').innerHTML = '<p class="boot-msg" style="padding:48px 24px;font-size:14px">사이트를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</p>'; return; }
let session = null;
try { const { data } = await withTimeout(sb.auth.getSession(), 4000); session = data && data.session; }
catch (e) {
/* 세션 확인이 멈추면 저장된 로그인 정보로 한 번 더 시도한다 */
try {
const k = Object.keys(localStorage).find(x => x.startsWith('sb-') && x.endsWith('-auth-token'));
const saved = k && JSON.parse(localStorage.getItem(k));
if (saved && saved.refresh_token) { const { data } = await withTimeout(sb.auth.setSession({ access_token: saved.access_token, refresh_token: saved.refresh_token }), 5000); session = data && data.session; }
} catch (e2) {}
}
if (!session) { showLogin(); return; }
try { await start(session); } catch (e) { await dropSession(); showLogin('다시 로그인해 주세요.'); }
})();
</script>
