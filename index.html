<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IssueCanvas</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
/* Layout: 왼쪽 네이비 사이드바 + 오른쪽 작업 영역. 대시보드는 마감 캘린더(왼쪽)와 팀 상태·선택 날짜·이번 주 일정(오른쪽 열). 팀 일정은 월~일 주간 보드와 오른쪽 상세 패널. */
:root {
--bg: #F7F8FA; --surface: #FFFFFF; --sunken: #F2F4F7; --line: #E7EAF0; --line-strong: #D3D9E3;
--fg: #101B3D; --muted: #5A6478; --faint: #8E97A9;
--side: #0C1A52; --side-fg: #FFFFFF; --side-muted: #AEBCE8; --side-line: rgba(255,255,255,.38); --side-hover: rgba(255,255,255,.09);
--navy: #0F2A78; --on-navy: #FFFFFF; --on-navy-soft: #C9D6FF; --navy-track: #2F4CA3;
--primary: #0F2A78; --on-primary: #FFFFFF;
--tint: #EAF0FF; --tint-fg: #173A9C; --select: #E6EDFF;
--red: #EF3B42; --red-text: #D1222A; --red-soft: #FFEDEE;
--blue: #2563EB; --blue-bg: #E8F0FF; --violet: #7C3AED; --violet-bg: #F1EBFF; --amber: #B45309; --amber-bg: #FFF2D9;
--green: #0E8A5F; --green-bg: #E1F7EE; --pink: #DB2777; --pink-bg: #FDEAF3; --cyan: #0E7490; --cyan-bg: #DFF6FA;
--orange: #EA580C; --orange-bg: #FFEEE4; --sky: #0369A1; --sky-bg: #E0F1FC; --lime: #4D7C0F; --lime-bg: #ECF8DA; --slate: #475569; --slate-bg: #EEF1F5;
--sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
--side-w: 232px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
--bg: #0B1020; --surface: #131A30; --sunken: #0F1528; --line: #252E4D; --line-strong: #3A4570;
--fg: #EEF2FF; --muted: #A9B3D0; --faint: #7F8AAD;
--side: #0A1648; --side-fg: #FFFFFF; --side-muted: #A9BAF0; --side-line: rgba(255,255,255,.3); --side-hover: rgba(255,255,255,.08);
--navy: #1C3A9E; --on-navy: #FFFFFF; --on-navy-soft: #C9D6FF; --navy-track: #3F5CC0;
--primary: #DCE6FF; --on-primary: #0B1530;
--tint: #1C2A5A; --tint-fg: #C9D6FF; --select: #223270;
--red: #FF5C62; --red-text: #FF8085; --red-soft: #3A1622;
--blue: #8FB4FF; --blue-bg: #1A2B57; --violet: #C4A8FF; --violet-bg: #2D2152; --amber: #FFC66B; --amber-bg: #3A2A12;
--green: #5FDDAA; --green-bg: #12352A; --pink: #FF8DC0; --pink-bg: #3E1830; --cyan: #6FE0F0; --cyan-bg: #123540;
--orange: #FFA06B; --orange-bg: #3E2214; --sky: #7CCBFF; --sky-bg: #12304A; --lime: #B5E36A; --lime-bg: #24361A; --slate: #B6C1D6; --slate-bg: #222B40;
color-scheme: dark;
} }
:root[data-theme="dark"] {
--bg: #0B1020; --surface: #131A30; --sunken: #0F1528; --line: #252E4D; --line-strong: #3A4570;
--fg: #EEF2FF; --muted: #A9B3D0; --faint: #7F8AAD;
--side: #0A1648; --side-fg: #FFFFFF; --side-muted: #A9BAF0; --side-line: rgba(255,255,255,.3); --side-hover: rgba(255,255,255,.08);
--navy: #1C3A9E; --on-navy: #FFFFFF; --on-navy-soft: #C9D6FF; --navy-track: #3F5CC0;
--primary: #DCE6FF; --on-primary: #0B1530;
--tint: #1C2A5A; --tint-fg: #C9D6FF; --select: #223270;
--red: #FF5C62; --red-text: #FF8085; --red-soft: #3A1622;
--blue: #8FB4FF; --blue-bg: #1A2B57; --violet: #C4A8FF; --violet-bg: #2D2152; --amber: #FFC66B; --amber-bg: #3A2A12;
--green: #5FDDAA; --green-bg: #12352A; --pink: #FF8DC0; --pink-bg: #3E1830; --cyan: #6FE0F0; --cyan-bg: #123540;
--orange: #FFA06B; --orange-bg: #3E2214; --sky: #7CCBFF; --sky-bg: #12304A; --lime: #B5E36A; --lime-bg: #24361A; --slate: #B6C1D6; --slate-bg: #222B40;
color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 390 14px/1.55 var(--sans); font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
h1, h2, h3, p, ul, figure { margin: 0; padding: 0; }
ul { list-style: none; }
h1, h2, h3 { text-wrap: balance; letter-spacing: -0.015em; }
b, strong { font-weight: 560; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* 색 묶음 */
.c-blue { --c: var(--blue); --cb: var(--blue-bg); } .c-violet { --c: var(--violet); --cb: var(--violet-bg); }
.c-amber { --c: var(--amber); --cb: var(--amber-bg); } .c-green { --c: var(--green); --cb: var(--green-bg); }
.c-pink { --c: var(--pink); --cb: var(--pink-bg); } .c-cyan { --c: var(--cyan); --cb: var(--cyan-bg); }
.c-orange { --c: var(--orange); --cb: var(--orange-bg); } .c-sky { --c: var(--sky); --cb: var(--sky-bg); }
.c-lime { --c: var(--lime); --cb: var(--lime-bg); } .c-slate { --c: var(--slate); --cb: var(--slate-bg); }
.c-red { --c: var(--red-text); --cb: var(--red-soft); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 520; padding: 1px 8px; border-radius: 999px; background: var(--cb, var(--sunken)); color: var(--c, var(--muted)); white-space: nowrap; line-height: 1.6; }
.tag.line { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--muted); }
.tag.ex { background: transparent; color: var(--faint); box-shadow: inset 0 0 0 1px var(--line); font-size: 10.5px; padding: 0 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; display: inline-block; }

/* 사이드바 */
.side { position: fixed; inset: 0 auto 0 0; width: var(--side-w); background: var(--side); color: var(--side-fg); display: flex; flex-direction: column; padding: calc(26px + env(safe-area-inset-top, 0px)) 0 calc(16px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px)); z-index: 40; overflow-y: auto; }
.logo { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 640; letter-spacing: -0.02em; padding-right: 22px; margin-bottom: 26px; }
.logo svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
.side-tools { display: grid; gap: 8px; padding-right: 22px; margin-bottom: 26px; position: relative; }
.side-btn, .side-search { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 34px; padding: 0 10px; border: 1px solid var(--side-line); border-radius: 4px; color: var(--side-fg); font-size: 12.5px; width: 100%; background: transparent; }
.side-btn:hover { background: var(--side-hover); }
.side-search input[type="search"] { background: transparent; border: 0; border-radius: 0; outline: 0; color: var(--side-fg); width: 100%; min-width: 0; font-size: 12.5px; padding: 0; -webkit-appearance: none; appearance: none; }
.side-search input::placeholder { color: var(--side-muted); }
.side-search:focus-within { border-color: var(--side-fg); }
.side-search svg.i, .side-btn svg.i { width: 15px; height: 15px; }
.nav { display: grid; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 11px; height: 40px; padding: 0 12px; border-radius: 6px 0 0 6px; color: var(--side-fg); font-size: 14px; font-weight: 460; }
.nav button:hover { background: var(--side-hover); }
.nav button[aria-current="page"] { background: var(--surface); color: var(--tint-fg); font-weight: 560; }
.nav .badge { min-width: 17px; height: 17px; padding: 0 5px; border-radius: 999px; background: var(--red); color: #FFF; font-size: 10.5px; font-weight: 600; display: inline-grid; place-items: center; }
.side-foot { margin-top: auto; padding: 18px 22px 0 12px; font-size: 11.5px; color: var(--side-muted); }
.menu { position: absolute; z-index: 60; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 14px 40px rgba(10, 20, 60, .22); padding: 6px; display: grid; min-width: 220px; }
.menu button { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px; font-size: 13.5px; text-align: left; }
.menu button:hover, .menu button.on { background: var(--sunken); }
.menu small { color: var(--muted); font-size: 11.5px; display: block; }
.side .menu { left: 0; right: 22px; top: 40px; }
.search-res { top: 82px; left: 0; right: 22px; max-height: 60vh; overflow-y: auto; }
.search-res .k { font-size: 11px; color: var(--muted); padding: 6px 10px 2px; }
.scrim { position: fixed; inset: 0; background: rgba(10, 16, 40, .45); z-index: 35; }

/* 본문 */
.app { margin-left: var(--side-w); min-height: 100vh; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); display: flex; align-items: center; gap: 12px; padding: 14px max(28px, env(safe-area-inset-right, 0px)) 6px 28px; }
.top .mobile { display: none; align-items: center; gap: 10px; }
.top h1 { font-size: 15px; font-weight: 560; color: var(--muted); }
.me-chip { margin-left: auto; display: flex; align-items: center; gap: 10px; font-weight: 520; padding: 4px 4px 4px 10px; border-radius: 999px; }
.me-chip:hover { background: var(--sunken); }
.icon-btn { width: 36px; height: 36px; border-radius: 8px; display: inline-grid; place-items: center; color: var(--fg); position: relative; }
.icon-btn:hover { background: var(--sunken); }
.icon-btn .badge { position: absolute; top: 3px; right: 2px; min-width: 15px; height: 15px; border-radius: 999px; background: var(--red); color: #FFF; font-size: 9.5px; display: grid; place-items: center; padding: 0 4px; }
main { padding: 10px max(28px, env(safe-area-inset-right, 0px)) 56px 28px; display: grid; gap: 16px; max-width: 1480px; }
@media (max-width: 900px) {
.side { transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.3); }
body.side-open .side { transform: none; }
.app { margin-left: 0; }
.top { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 8px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.top .mobile { display: flex; }
.top h1 { display: none; }
.me-chip .nm { display: none; }
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

.head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
.head h1 { font-size: 26px; font-weight: 640; line-height: 1.25; }
.head p { color: var(--muted); margin-top: 2px; }
.head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.sec-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sec-title small { font-size: 12px; color: var(--muted); font-weight: 400; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 7px; font-weight: 540; font-size: 13.5px; border: 1px solid var(--line-strong); background: var(--surface); white-space: nowrap; }
.btn:hover { border-color: var(--fg); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.primary:hover { opacity: .9; }
.btn.danger { color: var(--red-text); border-color: var(--red); background: transparent; }
.btn.small { padding: 4px 10px; font-size: 12.5px; }
.btn.link { border: 0; padding: 0; color: var(--blue); background: none; font-weight: 500; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn svg.i { width: 15px; height: 15px; }
.notice { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 9px 14px; background: var(--tint); color: var(--tint-fg); border-radius: 8px; font-size: 13px; }
.notice p { flex: 1 1 260px; min-width: 0; }
.notice.alert { background: var(--red-soft); color: var(--red-text); }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.sub { font-size: 12.5px; color: var(--muted); }
.stack { display: grid; gap: 8px; }
.empty { padding: 26px 12px; text-align: center; color: var(--muted); font-size: 13px; display: grid; gap: 8px; justify-items: center; }
.empty strong { color: var(--fg); font-size: 14px; font-weight: 560; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--primary); border-radius: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.fchip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); background: var(--surface); }
.fchip:hover { color: var(--fg); }
.fchip[aria-pressed="true"] { background: var(--cb, var(--tint)); color: var(--c, var(--tint-fg)); border-color: var(--c, var(--tint-fg)); font-weight: 540; }
.fchip .av { width: 18px; height: 18px; font-size: 9.5px; box-shadow: none; }

/* 아바타 */
.av { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10.5px; font-weight: 600; flex: none; overflow: hidden; background: var(--cb); color: var(--c); box-shadow: 0 0 0 2px var(--surface); }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avs { display: inline-flex; align-items: center; }
.avs .av + .av { margin-left: -6px; }

/* 대시보드 */
.dash { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
.dash > div { display: grid; gap: 16px; min-width: 0; }
@media (max-width: 1180px) { .dash { grid-template-columns: minmax(0, 1fr); } }
.summary { display: grid; gap: 10px; grid-template-columns: minmax(0, 1.9fr) repeat(3, minmax(0, 1fr)); }
.hero { display: grid; gap: 10px; align-content: space-between; padding: 16px 18px; border-radius: 12px; background: var(--navy); color: var(--on-navy); width: 100%; min-width: 0; }
.hero[data-act]:hover { box-shadow: 0 0 0 2px var(--line-strong); }
.hero .eyebrow { color: var(--on-navy-soft); font-size: 12px; font-weight: 460; }
.hero .line { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.hero .ti { display: block; font-size: 18px; font-weight: 560; line-height: 1.35; }
.hero .dd { font-weight: 600; font-size: 24px; line-height: 1.1; white-space: nowrap; }
.hero .meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--on-navy-soft); font-size: 12px; }
.hero .bar { background: var(--navy-track); }
.hero .bar i { background: var(--on-navy); }
.stat { display: grid; gap: 2px; align-content: start; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.stat:hover { border-color: var(--line-strong); }
.stat[aria-pressed="true"] { border-color: var(--fg); }
.stat .k { font-size: 12.5px; color: var(--muted); font-weight: 460; }
.stat .v { font-size: 25px; font-weight: 600; line-height: 1.25; }
.stat .v.hot { color: var(--red-text); }
.stat .s { font-size: 12px; color: var(--muted); }
@media (max-width: 860px) { .summary { grid-template-columns: repeat(3, minmax(0, 1fr)); } .hero { grid-column: 1 / -1; } .stat { padding: 11px 12px; } .stat .v { font-size: 21px; } }

.team { padding: 16px; display: grid; gap: 14px; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 14px 6px; }
.person { display: grid; justify-items: center; gap: 3px; text-align: center; min-width: 0; }
.person .pic { position: relative; }
.person .pic .av { width: 58px; height: 58px; font-size: 20px; box-shadow: 0 0 0 1px var(--line); }
.person .pic .dot { position: absolute; right: 2px; bottom: 3px; width: 13px; height: 13px; box-shadow: 0 0 0 2.5px var(--surface); }
.person .nm { font-size: 13px; font-weight: 540; margin-top: 3px; }
.person .note { font-size: 11px; color: var(--muted); overflow-wrap: anywhere; line-height: 1.35; }
.person.me .nm::after { content: " (나)"; color: var(--faint); font-weight: 400; font-size: 11px; }
.person button.change { font-size: 11px; color: var(--blue); }
.status-edit { display: grid; gap: 10px; padding: 12px; background: var(--sunken); border-radius: 10px; }

/* 월간 캘린더 */
.cal { padding: 14px 16px 16px; display: grid; gap: 12px; }
.cal-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; justify-content: space-between; }
.month { display: flex; align-items: center; gap: 6px; }
.month h2 { font-size: 18px; font-weight: 640; min-width: 112px; text-align: center; }
.round { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); display: inline-grid; place-items: center; color: var(--muted); }
.round:hover { color: var(--fg); border-color: var(--line-strong); }
.round svg.i { width: 15px; height: 15px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 14px; height: 9px; border-radius: 2px; background: var(--cb); }
.legend i.m { background: var(--navy); }
.legend i.o { background: var(--red-soft); box-shadow: inset 0 0 0 1px var(--red); }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.dow { padding: 5px 0; text-align: center; font-size: 12px; color: var(--muted); background: var(--sunken); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.cell { min-height: 108px; padding: 5px; display: flex; flex-direction: column; gap: 3px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: pointer; min-width: 0; }
.cell:hover { background: var(--sunken); }
.cell.out .num { color: var(--faint); }
.cell.out .chip { opacity: .55; }
.cell.sel { background: var(--select); }
.num { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; flex: none; text-align: center; }
.cell.today .num { background: var(--primary); color: var(--on-primary); font-weight: 600; }
.chip { display: block; width: 100%; padding: 2px 6px; border-radius: 5px; font-size: 11.5px; line-height: 1.45; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; background: var(--cb); color: var(--c); text-align: left; }
.chip b { font-weight: 560; font-size: 10px; opacity: .85; margin-right: 3px; }
.chip.m { background: var(--navy); color: var(--on-navy); font-weight: 540; }
.chip.m.sel { box-shadow: 0 0 0 2px var(--blue); }
.chip.over { background: var(--red-soft); color: var(--red-text); box-shadow: inset 0 0 0 1px var(--red); }
.chip.closed { background: transparent; color: var(--faint); text-decoration: line-through; }
.chip.team-ev { background: transparent; color: var(--c); box-shadow: inset 0 0 0 1px var(--cb); }
.more { font-size: 11px; color: var(--muted); padding-left: 5px; text-align: left; }
.more:hover { color: var(--fg); text-decoration: underline; }
@media (max-width: 720px) {
.cal { padding: 12px 10px; }
.cell { min-height: 60px; padding: 3px; gap: 2px; align-items: center; }
.chip { height: 5px; padding: 0; font-size: 0; border-radius: 2px; pointer-events: none; background: var(--c); }
.chip b { display: none; }
.chip.m { background: var(--fg); }
.chip.over { background: var(--red); box-shadow: none; }
.chip.closed { background: var(--line-strong); }
.more { display: none; }
}

/* 패널·행 */

const PROJECTS = ['BeCalmiOS', 'BeCalmAndroid'];
const PROJ_C = { BeCalmiOS: 'sky', BeCalmAndroid: 'lime', BeCalm: 'slate' };
const PROJ_S = { BeCalmiOS: 'iOS', BeCalmAndroid: 'AOS', BeCalm: '공통' };
const CATS = { CS: 'CS (Customer Service)', QA: 'QA (품질 검수)', Product: 'Product (제품 개발)' };
const CAT_C = { CS: 'orange', QA: 'cyan', Product: 'violet' };
const STEPS = ['열림', '담당자 확인 완료', '수정 완료', '닫힘'];

const ECAT = { business: ['비즈니스 이벤트', 'blue'], external_meeting: ['외근·미팅', 'violet'], absence: ['부재', 'amber'], vacation: ['휴가', 'green'], personal: ['개인 일정', 'pink'], other: ['기타', 'cyan'] };
const VIS = { team: ['팀 공개', '모든 팀원에게 제목까지 보여요.'], limited: ['제한 공개', '팀원에게는 유형·시간·관련 인물만, 관련 인물에게는 제목까지 보여요.'], private: ['비공개', '다른 팀원에게는 개인 일정과 시간만 보여요.'] };
const MSTATUS = { 근무중: 'green', 외근중: 'orange', 회의중: 'violet', 재택근무: 'sky', 휴가: 'pink', 자리비움: 'slate' };
const AV_C = ['blue', 'violet', 'green', 'pink', 'cyan', 'orange', 'sky', 'lime', 'amber'];
const ICON = {
home: '<path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/>',
issue: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/><path d="m9 15 2 2 4-4"/>',
cal: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>',
layers: '<path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/>',
bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4l2-2Z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
plus: '<path d="M12 5v14M5 12h14"/>', x: '<path d="M6 6l12 12M18 6 6 18"/>',
left: '<path d="m15 6-6 6 6 6"/>', right: '<path d="m9 6 6 6-6 6"/>',
flag: '<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>', clock: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
users: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 4.5a3 3 0 0 1 0 6M18 14.8c2 .7 3 2.6 3 5.2"/>',
};
const icon = (n, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

/* ---------- 상태 ---------- */
const S = {
me: null, members: [], issues: [], milestones: [], comments: [], events: [], notifs: [],
load: 'loading', route: 'dashboard', from: 'dashboard',
month: null, kind: 'all', project: 'all', openOnly: false, sel: { type: 'home' }, confirm: null,
taskProject: 'all', taskOpen: false,
week: null, sf: { types: new Set(), people: new Set(), cancelled: false, deadlines: true },
drawer: null, statusEdit: false, nfilter: 'all', q: '', pop: null, uploading: null,
add: null,
};

/* ---------- 도우미 ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const KST = 9 * 3600e3;
const today = () => new Date(Date.now() + KST).toISOString().slice(0, 10);
const kst = iso => { const s = new Date(new Date(iso).getTime() + KST).toISOString(); return { date: s.slice(0, 10), time: s.slice(11, 16) }; };
const toIso = (d, t) => `${d}T${t || '00:00'}:00+09:00`;
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dowOf = s => new Date(s + 'T00:00:00Z').getUTCDay();
const weekStart = s => addDays(s, -((dowOf(s) + 6) % 7));
const diff = s => Math.round((Date.parse(s + 'T00:00:00Z') - Date.parse(today() + 'T00:00:00Z')) / 864e5);
const dlabel = s => { const d = diff(s); return d === 0 ? 'D-Day' : d > 0 ? `D-${d}` : `D+${-d}`; };
const md = s => `${+s.slice(5, 7)}.${+s.slice(8, 10)}`;
const full = s => `${s.slice(0, 4)}.${s.slice(5, 7)}.${s.slice(8, 10)} (${DOW[dowOf(s)]})`;
const stamp = iso => { if (!iso) return ''; const k = kst(iso); return `${k.date.replace(/-/g, '.')} ${k.time}`; };
const ago = iso => { const m = Math.round((Date.now() - new Date(iso)) / 6e4); if (m < 1) return '방금'; if (m < 60) return `${m}분 전`; const h = Math.round(m / 60); if (h < 24) return `${h}시간 전`; const d = Math.round(h / 24); return d < 7 ? `${d}일 전` : stamp(iso).slice(0, 10); };
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const isAdmin = () => S.me && S.me.role === 'admin';

/* ---------- 팀원 ---------- */
const member = id => S.members.find(m => m.id === id);
const nameOf = id => member(id)?.name || (typeof id === 'string' && id.length < 30 ? id : '팀원');
const hue = s => AV_C[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % AV_C.length];
function avatar(id, extra = '') {
const m = member(id), n = nameOf(id);
if (m && m.avatar) return `<span class="av ${extra}" title="${esc(n)}"><img src="${esc(m.avatar)}" alt=""></span>`;
return `<span class="av c-${hue(n)} ${extra}" title="${esc(n)}">${esc(n.slice(0, 1))}</span>`;
}
const team = () => S.members.filter(m => !m.hidden || m.id === S.me?.id).sort((a, b) => a.sort - b.sort || a.name.localeCompare(b.name));

/* ---------- 이슈·마감 판정 ---------- */
const closed = i => (i.step || 0) >= 3;
const takers = i => [...(i.takers || []), ...(i.exampleTakers || [])];
const free = i => !closed(i) && takers(i).length === 0;
const isMine = i => !!S.me && (i.takers || []).includes(S.me.id);
const over = i => !closed(i) && diff(i.due) < 0;
const hot = i => !closed(i) && (diff(i.due) <= 0 || (free(i) && diff(i.due) <= 3));
const canAct = i => isMine(i) || isAdmin();
const istatus = i => closed(i) ? ['닫힘', 'green'] : i.step === 2 ? ['수정 완료', 'violet'] : i.step === 1 ? ['담당자 확인 완료', 'blue'] : takers(i).length ? ['내용 확인 중', 'blue'] : ['열림', ''];
const inProject = (p, sel) => sel === 'all' || p === sel || p === 'BeCalm';
const linked = m => (m.issueIds || []).map(id => S.issues.find(i => i.id === id)).filter(Boolean).sort((a, b) => a.due.localeCompare(b.due));
const prog = m => { const l = linked(m), c = l.filter(closed).length; return { n: l.length, c, pct: l.length ? Math.round(c / l.length * 100) : 0, done: l.length > 0 && c === l.length }; };
const milestonesOf = i => S.milestones.filter(m => (m.issueIds || []).includes(i.id));
const creatorName = x => x.creator ? nameOf(x.creator) : (x.exampleCreator || '팀원');
const canManage = x => isAdmin() || (!!S.me && x.creator === S.me.id);

/* ---------- 팀 일정 판정 ---------- */
const evLabel = e => e.title != null ? e.title : (e.visibility === 'private' ? '개인 일정' : ECAT[e.category][0]);
const evColor = e => ECAT[e.category][1];
const evEnd = e => { const en = kst(e.end_at); return e.all_day ? addDays(en.date, -1) : (en.time === '00:00' ? addDays(en.date, -1) : en.date); };
function evDays(e) { const s = kst(e.start_at).date, end = evEnd(e), out = []; for (let d = s; d <= end && out.length < 60; d = addDays(d, 1)) out.push(d); return out; }
function evTime(e, day) {
if (e.all_day) return '종일';
const s = kst(e.start_at), en = kst(e.end_at), end = evEnd(e);
if (s.date === end) return `${s.time}–${en.time}`;
if (day === s.date) return `${s.time}~`;
if (day === end) return `~${en.time}`;
return '종일';
}
function evRange(e) {
const s = kst(e.start_at), end = evEnd(e);
if (e.all_day) return s.date === end ? `${full(s.date)} · 종일` : `${full(s.date)} ~ ${full(end)} · 종일`;
const en = kst(e.end_at);
return s.date === end ? `${full(s.date)} · ${s.time}–${en.time}` : `${full(s.date)} ${s.time} ~ ${full(end)} ${en.time}`;
}
const canEditEv = e => !!S.me && (e.created_by === S.me.id || (isAdmin() && e.visibility === 'team'));
const evOn = (day, opts = {}) => S.events.filter(e => (opts.cancelled || e.status === 'active') && evDays(e).includes(day))
.sort((a, b) => (b.all_day - a.all_day) || a.start_at.localeCompare(b.start_at));

/* ---------- 공통 조각 ---------- */
const avs = ids => `<span class="avs">${ids.map(id => avatar(id)).join('')}</span>`;
function takerAvs(i) {
const a = (i.takers || []).map(id => avatar(id));
const b = (i.exampleTakers || []).map(n => avatar(n));
return `<span class="avs">${a.concat(b).join('')}</span>`;
}
const dueTag = i => closed(i) ? `<span class="due">${md(i.due)}</span>` : `<span class="due${hot(i) ? ' hot' : ''}">${free(i) ? '미배정 · ' : ''}${md(i.due)} · <b>${dlabel(i.due)}</b></span>`;
const ipill = i => { const [t, c] = istatus(i); return `<span class="tag ${c ? 'c-' + c : 'line'}">${esc(t)}</span>`; };
const exTag = x => x.example ? '<span class="tag ex">예시</span>' : '';
const projTag = p => `<span class="tag c-${PROJ_C[p] || 'slate'}">${esc(p)}</span>`;
const catTag = c => `<span class="tag c-${CAT_C[c] || 'slate'}">${esc(c)}</span>`;
const evTag = e => `<span class="tag c-${evColor(e)}">${ECAT[e.category][0]}</span>`;
const issueRow = i => `<button class="row" data-act="issue" data-id="${esc(i.id)}">
<span class="r1"><span class="code">${esc(i.code)}</span>${projTag(i.project)}${exTag(i)}</span>
<span class="t">${esc(i.title)}</span>
<span class="r2"><span class="r1">${ipill(i)}${takerAvs(i)}</span>${dueTag(i)}</span></button>`;
function msRow(m) {
const p = prog(m), late = !p.done && diff(m.date) < 0;
const dd = p.done ? '<span class="due">완료</span>' : `<span class="due${diff(m.date) <= 0 ? ' hot' : ''}">${md(m.date)} · <b>${dlabel(m.date)}</b></span>`;
return `<button class="row" data-act="milestone" data-id="${esc(m.id)}">
<span class="r1">${projTag(m.project)}${exTag(m)}${late ? '<span class="tag c-red">기한 초과</span>' : ''}</span>
<span class="t">${esc(m.title)}</span>
<span class="bar"><i style="width:${p.pct}%"></i></span>
<span class="r2"><span class="pct">${p.c} / ${p.n} 닫힘</span>${dd}</span></button>`;
}
function miniEv(e, showDate) {
const s = kst(e.start_at);
return `<button class="mini-ev c-${evColor(e)}" data-act="event" data-id="${e.id}">
<span class="when">${showDate ? md(s.date) + ' ' : ''}${evTime(e, s.date)}</span><span class="what">${esc(evLabel(e))}</span>
<span class="who">${avs(e.participants)}<span>${esc(e.participants.map(nameOf).join(', '))} · ${ECAT[e.category][0]}</span></span></button>`;
}
const emptyBox = (t, s, extra = '') => `<div class="empty"><strong>${esc(t)}</strong><span>${esc(s)}</span>${extra}</div>`;
function relatedHTML(date) {
if (!date) return '<div class="rel"><span class="sub">날짜를 고르면 그날 팀 일정을 함께 보여 드려요.</span></div>';
const evs = evOn(date);
const lines = evs.map(e => `<div class="rl">${avs(e.participants)}<b>${esc(e.participants.map(nameOf).join(', '))}</b><span>${evTime(e, date)}</span><span class="tag c-${evColor(e)}">${ECAT[e.category][0]}</span><span>${esc(evLabel(e))}</span></div>`).join('');
return `<div class="rel"><div class="sec"><span>${md(date)} 팀 일정 ${evs.length}건</span><button type="button" class="btn link" data-act="rel-week" data-id="${date}">주간 일정에서 보기</button></div>
${lines || '<span class="sub">이 날짜에 등록된 팀 일정이 없어요. 일정이 없다고 모두 가능하다는 뜻은 아니에요.</span>'}
${evs.length ? '<span class="sub">참고용 정보예요. 마감 저장을 막지 않아요.</span>' : ''}</div>`;
}

/* ---------- 대시보드 ---------- */
function summary() {
const iss = S.issues.filter(i => inProject(i.project, S.project));
const ms = S.milestones.filter(m => inProject(m.project, S.project) && !prog(m).done && diff(m.date) >= 0).sort((a, b) => a.date.localeCompare(b.date));
const n = ms[0], t0 = weekStart(today()), t1 = addDays(t0, 6);
const week = iss.filter(i => !closed(i) && i.due >= t0 && i.due <= t1);
const fr = iss.filter(free), soon = fr.filter(i => diff(i.due) <= 3), late = iss.filter(over);
let hero;
if (n) {
const p = prog(n);
hero = `<button class="hero" data-act="milestone" data-id="${esc(n.id)}"><span class="eyebrow">다음 주요 마감</span>
<span class="line"><span class="ti">${esc(n.title)}</span><span class="dd">${dlabel(n.date)}</span></span>
<span class="bar"><i style="width:${p.pct}%"></i></span>
<span class="meta"><span>${esc(n.project)} · ${full(n.date)}</span><span>연결 이슈 ${p.n}개 중 ${p.c}개 닫힘</span></span></button>`;
} else hero = `<div class="hero"><span class="eyebrow">다음 주요 마감</span><span class="ti">${S.load === 'loading' ? '불러오는 중이에요' : '예정된 주요 마감이 없어요'}</span><span class="meta"><span>주요 마감을 등록하면 D-Day와 진행률이 여기에 보여요.</span></span></div>`;
const pressed = k => S.sel.type === 'list' && S.sel.id === k;
const stat = (k, label, v, sub, h) => `<button class="stat" data-act="list" data-id="${k}" aria-pressed="${pressed(k)}"><span class="k">${label}</span><span class="v${h && v ? ' hot' : ''}">${v}</span><span class="s">${esc(sub)}</span></button>`;
return `<section class="summary" aria-label="요약">${hero}
${stat('week', '이번 주 마감', week.length, `미배정 ${week.filter(free).length}개`)}
${stat('free', '미배정 이슈', fr.length, `3일 안에 마감 ${soon.length}개`, soon.length > 0)}
${stat('late', '기한 초과', late.length, '아직 닫히지 않은 이슈', true)}</section>`;
}
function calendar() {
const [y, mo] = S.month.split('-').map(Number);
const first = `${S.month}-01`, start = addDays(first, -dowOf(first));
const days = new Date(Date.UTC(y, mo, 0)).getUTCDate();
const cells = Math.ceil((dowOf(first) + days) / 7) * 7, t = today();
const seld = S.sel.type === 'date' ? S.sel.id : null, selm = S.sel.type === 'milestone' ? S.sel.id : null;
let html = DOW.map(d => `<div class="dow">${d}</div>`).join('');
for (let k = 0; k < cells; k++) {
const key = addDays(start, k);
const ms = S.kind === 'issue' ? [] : S.milestones.filter(x => x.date === key && inProject(x.project, S.project));
const iss = S.kind === 'milestone' ? [] : S.issues.filter(i => i.due === key && inProject(i.project, S.project) && !(S.openOnly && closed(i)));
const chips = [
...ms.map(x => `<button class="chip m${x.id === selm ? ' sel' : ''}" data-act="milestone" data-id="${esc(x.id)}" title="주요 마감: ${esc(x.title)}">${esc(x.title)}</button>`),
...iss.map(i => `<button class="chip c-${PROJ_C[i.project] || 'slate'}${over(i) ? ' over' : closed(i) ? ' closed' : ''}" data-act="issue" data-id="${esc(i.id)}" title="${esc(i.code)} ${esc(i.project)}: ${esc(i.title)}"><b>${PROJ_S[i.project] || ''}</b>${esc(i.title)}</button>`),
];
const nev = evOn(key).length;
const extra = chips.length - 3;
html += `<div class="cell${key.slice(0, 7) !== S.month ? ' out' : ''}${key === t ? ' today' : ''}${key === seld ? ' sel' : ''}" data-act="date" data-id="${key}">
<button class="num" aria-label="${+key.slice(5, 7)}월 ${+key.slice(8)}일, 마감 ${chips.length}개, 팀 일정 ${nev}개">${+key.slice(8)}</button>
${chips.slice(0, 3).join('')}${extra > 0 ? `<button class="more" data-act="date" data-id="${key}">+${extra}개 더보기</button>` : ''}
${nev ? `<span class="more" style="pointer-events:none">팀 일정 ${nev}</span>` : ''}</div>`;
}
const chip = (act, val, cur, label, c = '') => `<button class="fchip ${c}" data-act="${act}" data-id="${val}" aria-pressed="${cur === val}">${label}</button>`;
return `<section class="sheet cal" aria-label="마감 캘린더">
<div class="cal-head">
<div class="month"><button class="round" data-act="prev" aria-label="이전 달">${icon('left')}</button><h2>${y}년 ${mo}월</h2><button class="round" data-act="next" aria-label="다음 달">${icon('right')}</button><button class="btn small" data-act="thismonth">오늘</button></div>
<div class="chips">${chip('kind', 'all', S.kind, '전체 마감')}${chip('kind', 'milestone', S.kind, '주요 마감')}${chip('kind', 'issue', S.kind, '이슈 마감')}</div>
</div>
<div class="cal-head">
<div class="chips">${chip('proj', 'all', S.project, '전체 프로젝트')}${PROJECTS.map(p => chip('proj', p, S.project, p, 'c-' + PROJ_C[p])).join('')}<button class="fchip" data-act="openonly" aria-pressed="${S.openOnly}">닫힌 이슈 숨기기</button></div>
<div class="legend"><span><i class="m"></i>주요 마감</span><span class="c-sky"><i></i>iOS 이슈</span><span class="c-lime"><i></i>AOS 이슈</span><span><i class="o"></i>기한 초과</span></div>
</div>
<div class="grid">${html}</div></section>`;
}
function panel() {
const s = S.sel;
if (s.type === 'date') {
const ms = S.milestones.filter(x => x.date === s.id && inProject(x.project, S.project));
const iss = S.issues.filter(i => i.due === s.id && inProject(i.project, S.project));
const evs = evOn(s.id);
return `<div class="p-head"><div><h2>${+s.id.slice(5, 7)}월 ${+s.id.slice(8)}일 ${DOW[dowOf(s.id)]}요일</h2><p class="sub">마감 ${ms.length + iss.length}건 · 팀 일정 ${evs.length}건</p></div><button class="btn small" data-act="home">닫기</button></div>
${ms.length ? `<div class="stack"><div class="sec">주요 마감</div>${ms.map(msRow).join('')}</div>` : ''}
${iss.length ? `<div class="stack"><div class="sec">이슈 마감</div>${iss.map(issueRow).join('')}</div>` : ''}
<div class="stack"><div class="sec"><span>팀 일정</span><button class="btn link" data-act="rel-week" data-id="${s.id}">주간 보기</button></div>${evs.map(e => miniEv(e)).join('') || '<span class="sub">이 날짜에 등록된 팀 일정이 없어요.</span>'}</div>`;
}
if (s.type === 'milestone') {
const m = S.milestones.find(x => x.id === s.id);
if (m) {
const p = prog(m), l = linked(m), hist = m.history || [];
const manage = canManage(m) ? (S.confirm === m.id

.on('postgres_changes', { event: '*', schema: 'public', table: 'members' }, () => reload('members'))
.on('postgres_changes', { event: '*', schema: 'public', table: 'team_events' }, () => reload('events'))
.on('postgres_changes', { event: '*', schema: 'public', table: 'event_details' }, () => reload('events'))

function searchHTML() {

const ev = S.events.filter(e => e.title != null && has(e.title)).sort((a, b) => b.start_at.localeCompare(a.start_at)).slice(0, 5);
const pp = team().filter(m => has(m.name)).slice(0, 3);
const sec = (k, arr) => arr.length ? `<div class="k">${k}</div>${arr.join('')}` : '';
const html = sec('이슈', iss.map(i => `<button data-act="issue" data-id="${esc(i.id)}"><span>${esc(i.code)} ${esc(i.title)}<small>${esc(i.project)} · 마감 ${md(i.due)}</small></span></button>`))
+ sec('주요 마감', ms.map(m => `<button data-act="milestone" data-id="${esc(m.id)}"><span>${esc(m.title)}<small>${full(m.date)}</small></span></button>`))

/* ---------- 영상 ---------- */
const BUCKET = 'issue-videos';
const videos = {
upload: async (issueId, file) => {
const ext = (file.name.split('.').pop() || 'mp4').replace(/[^a-z0-9]/gi, '').toLowerCase().slice(0, 8) || 'mp4';
const path = issueId + '/' + rid() + '.' + ext;
const { error } = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type, upsert: false });
if (error) throw error; return path;
},
url: async path => { const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 21600); if (error) throw error; return data.signedUrl; },
remove: async paths => { const { error } = await sb.storage.from(BUCKET).remove(paths); if (error) throw error; },
};
function attachVideos(playing) {
document.querySelectorAll('.vid-slot').forEach(slot => {
const path = slot.dataset.path; let box = vidCache[path];
if (!box) {
box = document.createElement('div');
const v = document.createElement('video'); v.controls = true; v.preload = 'metadata'; v.playsInline = true;
const fail = t => { box.textContent = ''; const d = document.createElement('div'); d.className = 'vid-err'; d.textContent = t; box.append(d); };
v.addEventListener('error', () => fail('이 브라우저에서 재생할 수 없는 영상이에요. MP4로 변환해 다시 올려 보세요.'));
box.append(v); vidCache[path] = box;
videos.url(path).then(u => { v.src = u; }).catch(() => fail('영상을 불러오지 못했어요. 페이지를 새로 열어 주세요.'));
}
slot.append(box);
});
playing.forEach(v => { if (v.isConnected) v.play().catch(() => {}); });
}
async function uploadVideo(file) {
if (!file) return;
if (!file.type.startsWith('video/')) { toast('영상 파일만 올릴 수 있어요.'); return; }
if (file.size > MAX_VIDEO) { toast(`50MB 이하의 영상만 올릴 수 있어요. 지금 파일은 ${(file.size / 1048576).toFixed(0)}MB예요.`); return; }
const id = curIssue; S.uploading = id; render();
try {
const path = await videos.upload(id, file);
const v = { path, name: file.name.slice(0, 120), size: file.size, type: file.type, by: S.me.id, at: new Date().toISOString() };
const cur = S.issues.find(x => x.id === id);
await write(() => docs.update('issues', id, { videos: [...((cur && cur.videos) || []), v] }), '영상을 올렸어요');
await loadDocs('issues');
} catch (e) { toast('영상을 올리지 못했어요. 파일과 인터넷 연결을 확인한 뒤 다시 시도하세요.'); }
S.uploading = null; render();
}

}
function editCard(e) {

return { idx: 0, raw: '', title: e.title || '', note: e.note || '', date: s.date, dateOk: true, allDay: e.all_day, endDate: e.all_day ? end : '', start: e.all_day ? '' : s.time, end: e.all_day ? '' : en.time, nextDay: !e.all_day && end !== s.date,
category: e.category, typeOk: true, visibility: e.visibility, visTouched: true, participants: e.participants.slice(), saved: false, excluded: false, dupOk: true, version: e.version };
}
async function saveEvent() {
const d = S.drawer, c = d.card, e = S.events.find(x => x.id === d.id);

const t = cardTimes(c), patch = {};
if (c.title.trim() !== e.title) patch.title = c.title.trim();
if ((c.note || '') !== (e.note || '')) patch.note = c.note || '';
if (new Date(t.start_at).getTime() !== new Date(e.start_at).getTime()) patch.start_at = t.start_at;

d.saving = false;
if (error) {
if (/version_conflict/.test(error.message)) {
await loadEvents(); const ne = S.events.find(x => x.id === d.id);
d.card = editCard(ne); d.notice = `${nameOf(ne.updated_by)}님이 먼저 이 일정을 수정했어요. 최신 내용으로 다시 불러왔어요. 확인한 뒤 다시 저장해 주세요.`;
} else d.notice = /forbidden/.test(error.message) ? '이 일정을 수정할 권한이 없어요.' : '저장하지 못했어요. 입력한 내용은 그대로 있어요. 다시 시도해 주세요.';

function setAvatar(file) {

{ const m = S.milestones.find(x => x.id === id); if (m) S.month = m.date.slice(0, 7); }

break;
case 'date': S.sel = { type: 'date', id }; S.confirm = null; render(); scrollPanel(); break;
case 'list': S.sel = S.sel.type === 'list' && S.sel.id === id ? { type: 'home' } : { type: 'list', id }; render(); scrollPanel(); break;
case 'home': S.sel = { type: 'home' }; S.confirm = null; render(); break;
case 'prev': case 'next': { const [y, m] = S.month.split('-').map(Number), d = new Date(Date.UTC(y, m - 1 + (a === 'next' ? 1 : -1), 1)); S.month = d.toISOString().slice(0, 7); render(); break; }
case 'thismonth': S.month = today().slice(0, 7); S.sel = { type: 'date', id: today() }; render(); break;
case 'kind': S.kind = id; render(); break;
case 'proj': S.project = id; render(); break;
case 'openonly': S.openOnly = !S.openOnly; render(); break;
case 'tproj': S.taskProject = id; render(); break;
case 'topen': S.taskOpen = !S.taskOpen; render(); break;
case 'p-cal': S.project = id; go('dashboard'); break;
case 'p-task': S.taskProject = id; go('issues'); break;
case 'new-ms': S.pop = null; renderSide(); openMs(); break;
case 'new-issue': S.pop = null; renderSide(); openIssue(); break;
case 'ms-edit': openMs(S.milestones.find(x => x.id === id)); break;
case 'dlg-close': dlg.close(); break;
case 'ms-del': S.confirm = id; render(); break;
case 'ms-del-yes': S.confirm = null; S.sel = { type: 'home' }; await write(() => docs.del('milestones', id), '주요 마감을 삭제했어요'); await loadDocs('milestones'); render(); break;
case 'confirm-no': S.confirm = null; render(); break;
case 'iss-del': S.confirm = curIssue; render(); break;
case 'iss-del-yes': {
const iid = curIssue, ms = milestonesOf(cur); S.confirm = null; go(S.from);
await write(() => docs.del('issues', iid), '이슈를 삭제했어요');
if ((cur.videos || []).length) videos.remove(cur.videos.map(v => v.path)).catch(() => {});
for (const m of ms) await write(() => docs.update('milestones', m.id, { issueIds: m.issueIds.filter(x => x !== iid) }));
for (const c of S.comments.filter(c => c.issueId === iid)) await write(() => docs.del('comments', c.id));
await loaders.docs(); render(); break;
}
case 'ex-del': S.confirm = 'examples'; render(); break;
case 'ex-del-yes': {
const iss = S.issues.filter(i => i.example), ms = S.milestones.filter(m => m.example); S.confirm = null; S.sel = { type: 'home' };
for (const m of ms) await write(() => docs.del('milestones', m.id));
for (const i of iss) { await write(() => docs.del('issues', i.id)); for (const c of S.comments.filter(c => c.issueId === i.id)) await write(() => docs.del('comments', c.id)); }
await loaders.docs(); render(); toast('예시를 삭제했어요'); break;
}
case 'take': await write(() => docs.update('issues', cur.id, { takers: [...(cur.takers || []), S.me.id] }), '이슈를 맡았어요'); await loadDocs('issues'); render(); break;
case 'untake': await write(() => docs.update('issues', cur.id, { takers: (cur.takers || []).filter(x => x !== S.me.id) }), '맡기를 취소했어요'); await loadDocs('issues'); render(); break;
case 'step': await write(() => docs.update('issues', cur.id, { step: +id })); await loadDocs('issues'); render(); break;
case 'send': send(id); break;
case 'vid-del': S.confirm = 'v:' + id; render(); break;
case 'vid-del-yes': { S.confirm = null; const ok = await write(() => docs.update('issues', cur.id, { videos: (cur.videos || []).filter(v => v.path !== id) }), '영상을 삭제했어요'); if (ok) { delete vidCache[id]; videos.remove([id]).catch(() => {}); } await loadDocs('issues'); render(); break; }
case 'rel-week': if (dlg.open) dlg.close(); S.week = weekStart(id); go('schedule'); break;
/* 팀 상태 */
case 'status-edit': S.statusEdit = true; S.statusPick = null; render(); break;
case 'status-cancel': S.statusEdit = false; render(); break;
case 'pick-status': S.statusPick = id; el.parentElement.querySelectorAll('.fchip').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === id)); break;
/* 팀 일정 */
case 'wk-prev': S.week = addDays(S.week, -7); render(); break;
case 'wk-next': S.week = addDays(S.week, 7); render(); break;
case 'wk-this': S.week = weekStart(today()); render(); break;
case 'wk-nextweek': S.week = addDays(weekStart(today()), 7); render(); break;
case 'sf-type': S.sf.types.has(id) ? S.sf.types.delete(id) : S.sf.types.add(id); render(); break;
case 'sf-person': S.sf.people.has(id) ? S.sf.people.delete(id) : S.sf.people.add(id); render(); break;
case 'sf-cancel': S.sf.cancelled = !S.sf.cancelled; render(); break;
case 'sf-dl': S.sf.deadlines = !S.sf.deadlines; render(); break;
case 'sf-reset': S.sf.types.clear(); S.sf.people.clear(); render(); break;
case 'person-week': S.pop = null; S.q = ''; $('#q').value = ''; S.sf.people = new Set([id]); S.week = weekStart(today()); go('schedule'); break;
case 'event': S.pop = null; renderSide(); if (dlg.open) dlg.close(); openEvent(id); break;
case 'drawer-close': S.drawer = null; renderDrawer(); render(); break;
case 'ev-edit': { const ev = S.events.find(x => x.id === S.drawer.id); S.drawer.edit = true; S.drawer.card = editCard(ev); S.drawer.notice = null; renderDrawer(); break; }
case 'ev-edit-cancel': S.drawer.edit = false; S.drawer.notice = null; renderDrawer(); break;
case 'ev-save': saveEvent(); break;
case 'ev-status': S.drawer.confirm = true; renderDrawer(); break;
case 'ev-status-no': S.drawer.confirm = false; renderDrawer(); break;
case 'ev-status-yes': setEventStatus(); break;
/* 일정 추가 */
case 'add-open': if (dlg.open) dlg.close(); openAdd(id); break;
case 'add-close': { const ok = S.add && S.add.result && !S.add.result.err; $('#add').close(); if (ok) { S.add = null; if (S.route !== 'schedule') go('schedule'); else render(); } break; }
case 'add-more': S.add = { tab: S.add.tab, text: '', cards: [], batch: null, result: null, saving: false }; if (S.add.tab === 'single') S.add.single = blankCard(); renderAdd(); setTimeout(() => ($('#add-text') || $('#add [data-f="title"]'))?.focus(), 30); break;
case 'add-tab': S.add.tab = id; if (id === 'single' && !S.add.single) S.add.single = blankCard(); S.add.result = null; renderAdd(); break;
case 'add-parse': doParse(); break;
case 'add-save': saveAdd(); break;
case 'preset': { const [k, ad, l] = id.split('|'), c = S.add.single; c.category = k; c.typeOk = true; c.visibility = c.visTouched ? c.visibility : defaultVis(k); c.allDay = ad === '1'; if (!c.title.trim()) c.title = l; if (!c.allDay && !c.start) { c.start = '10:00'; c.end = '11:00'; } c.participants = c.participants.length ? c.participants : [S.me.id]; renderAdd(); break; }
case 'card-ex': { const card = el.closest('.rcard'), [c, mode] = cardFromEl(card); c.excluded = !c.excluded; refreshCard(card, c, mode); break; }
case 'card-fix': {
const card = el.closest('.rcard'), [c, mode] = cardFromEl(card);
if (id === 'date-ok') c.dateOk = true; if (id === 'type-ok') c.typeOk = true; if (id === 'dup-ok') c.dupOk = true; if (id === 'nextday') c.nextDay = true;
if (id === 'allday') { c.allDay = true; mode === 'edit' ? renderDrawer() : renderAdd(); break; }
refreshCard(card, c, mode); break;
}
/* 알림 */
case 'nfilter': S.nfilter = id; render(); break;
case 'notif-all': await sb.rpc('mark_notifications_read', { p_ids: null }); await loadNotifs(); render(); break;
case 'notif': {
const n = S.notifs.find(x => String(x.id) === id);
if (n && !n.read_at) { n.read_at = new Date().toISOString(); sb.rpc('mark_notifications_read', { p_ids: [n.id] }).then(() => loadNotifs()).then(renderSide); }
if (n && n.event_id && S.events.some(x => x.id === n.event_id)) openEvent(n.event_id); else { toast('이 일정은 더 이상 볼 수 없어요.'); render(); }
break;
}
/* 설정 */
case 'avatar-clear': { const { error } = await sb.rpc('update_my_profile', { p: { avatar: '' } }); if (!error) { await loadMembers(); render(); toast('사진을 지웠어요'); } break; }
case 'logout': await sb.auth.signOut(); location.hash = ''; location.reload(); break;
}
});
$('#add').addEventListener('close', () => { if (S.add && S.add.result && !S.add.result.err) S.add = null; });
function scrollPanel() { if (innerWidth <= 1180) { const p = $('#panel'); if (p) p.scrollIntoView({ block: 'start', behavior: 'smooth' }); } }

/* ---------- 로그인과 시작 ---------- */
function showLogin(msg) {
const box = $('#login'); box.hidden = false;
const err = $('#l-err'); if (msg) { err.textContent = msg; err.hidden = false; }
setTimeout(() => $('#l-id').focus(), 30);
}
$('#l-form').addEventListener('submit', async ev => {
ev.preventDefault();
const err = $('#l-err'), btn = $('#l-btn'); err.hidden = true; btn.disabled = true;
const login = $('#l-id').value.trim().toLowerCase(), password = $('#l-pass').value;
const { data, error } = await sb.auth.signInWithPassword({ email: login + MAIL, password });
btn.disabled = false;
if (error) {
err.textContent = /banned/i.test(error.message) ? '이전 공용 계정은 더 이상 쓸 수 없어요. 개인 아이디로 로그인하세요.' : /invalid/i.test(error.message) ? '아이디 또는 비밀번호가 맞지 않아요.' : '로그인하지 못했어요. 잠시 후 다시 시도하세요.';
err.hidden = false; return;
}
$('#login').hidden = true; start(data.session);
});
async function start(session) {
try { await loadMembers(); } catch (e) { S.members = []; }
const me = S.members.find(m => m.id === session.user.id);
if (!me) { await sb.auth.signOut(); showLogin('팀원 목록에 없는 계정이에요. 관리자에게 문의하세요.'); return; }
S.me = me;
const h = legacy(location.hash.slice(1)); if (ROUTE_RE.test(h)) S.route = h;
render();
const timer = setTimeout(() => { if (S.load === 'loading') { S.load = 'slow'; render(); } }, 10000);
try { await Promise.all([loaders.docs(), loadEvents(), loadNotifs()]); S.load = 'ok'; }
catch (e) { S.load = 'error'; }
clearTimeout(timer); render(); subscribe();
}
S.month = today().slice(0, 7); S.week = weekStart(today());
(async () => {
const { data } = await sb.auth.getSession();
if (data.session) start(data.session); else showLogin();
})();
</script>
</body>
</html>
