<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IssueCanvas 마감</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
/* Layout: 팀 전체가 보는 날짜 보드. 요약 줄 → 월간 캘린더 + 선택 내용을 펼치는 오른쪽 패널. 이슈 상세는 한 줄기 문서형 칼럼. */
:root {
--bg: #F9FAFB; --surface: #FFFFFF; --sunken: #F3F5F8; --line: #E8EBF0; --line-strong: #D5DAE3;
--fg: #0F1F4D; --muted: #566077; --faint: #8C95A8;
--navy: #0F2A78; --on-navy: #FFFFFF; --on-navy-soft: #C9D6FF; --navy-track: #2F4CA3;
--primary: #0F2A78; --on-primary: #FFFFFF;
--tint: #EAF0FF; --tint-fg: #173A9C; --select: #E3EBFF;
--red: #EF3B42; --red-text: #D1222A; --red-soft: #FFEDEE;
--done: #0E8A5F; --done-soft: #E3F7EF;
--sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
--mono: var(--sans);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
--bg: #0B1020; --surface: #131A30; --sunken: #0F1528; --line: #252E4D; --line-strong: #3A4570;
--fg: #EEF2FF; --muted: #A9B3D0; --faint: #7F8AAD;
--navy: #1C3A9E; --on-navy: #FFFFFF; --on-navy-soft: #C9D6FF; --navy-track: #3F5CC0;
--primary: #DCE6FF; --on-primary: #0B1530;
--tint: #1C2A5A; --tint-fg: #C9D6FF; --select: #223270;
--red: #FF5C62; --red-text: #FF8085; --red-soft: #3A1622;
--done: #4FD6A2; --done-soft: #0F3329; color-scheme: dark;
} }
:root[data-theme="dark"] {
--bg: #0B1020; --surface: #131A30; --sunken: #0F1528; --line: #252E4D; --line-strong: #3A4570;
--fg: #EEF2FF; --muted: #A9B3D0; --faint: #7F8AAD;
--navy: #1C3A9E; --on-navy: #FFFFFF; --on-navy-soft: #C9D6FF; --navy-track: #3F5CC0;
--primary: #DCE6FF; --on-primary: #0B1530;
--tint: #1C2A5A; --tint-fg: #C9D6FF; --select: #223270;
--red: #FF5C62; --red-text: #FF8085; --red-soft: #3A1622;
--done: #4FD6A2; --done-soft: #0F3329; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--fg); font: 390 14px/1.55 var(--sans); font-variant-numeric: tabular-nums; }
b, strong { font-weight: 540; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
h1, h2, h3, p, ul { margin: 0; padding: 0; }
ul { list-style: none; }
h1, h2, h3 { text-wrap: balance; letter-spacing: -0.015em; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 20px; height: 54px; }
.logo { font-weight: 640; font-size: 16px; letter-spacing: -0.02em; }
.nav { display: flex; gap: 2px; }
.nav button { padding: 5px 11px; border-radius: 6px; color: var(--muted); font-weight: 460; }
.nav button:hover { color: var(--fg); background: var(--sunken); }
.nav button[aria-current="page"] { background: var(--tint); color: var(--tint-fg); font-weight: 540; }
.who { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; min-width: 0; }
.live { width: 7px; height: 7px; border-radius: 50%; background: var(--done); flex: none; }
@media (max-width: 520px) { .top .wrap { gap: 8px; } .who span.txt { display: none; } .nav button { padding: 5px 8px; } }
main { padding-block: 24px 56px; display: grid; gap: 16px; }
.head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
.head h1 { font-size: 26px; font-weight: 640; line-height: 1.25; }
.head p { color: var(--muted); margin-top: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 7px; font-weight: 540; font-size: 13.5px; border: 1px solid var(--line-strong); background: var(--surface); white-space: nowrap; }
.btn:hover { border-color: var(--fg); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.primary:hover { opacity: .9; }
.btn.danger { color: var(--red-text); border-color: var(--red); background: transparent; }
.btn.small { padding: 4px 10px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; cursor: default; }
.notice { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 9px 14px; background: var(--tint); color: var(--tint-fg); border-radius: 8px; font-size: 13px; }
.notice p { flex: 1 1 260px; min-width: 0; }
.notice.alert { background: var(--red-soft); color: var(--red-text); }
/* summary */
.summary { display: grid; gap: 10px; grid-template-columns: minmax(0, 2.1fr) repeat(3, minmax(0, 1fr)); }
.hero { display: grid; gap: 10px; align-content: space-between; padding: 16px 18px; border-radius: 10px; background: var(--navy); color: var(--on-navy); width: 100%; min-width: 0; }
.hero[data-act]:hover { box-shadow: 0 0 0 2px var(--line-strong); }
.hero .eyebrow { color: var(--on-navy-soft); font-size: 12px; font-weight: 460; }
.hero .line { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.hero .ti { display: block; font-size: 19px; font-weight: 540; line-height: 1.35; }
.hero .dd { font-family: var(--mono); font-weight: 540; font-size: 26px; line-height: 1.1; white-space: nowrap; }
.hero .meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--on-navy-soft); font-size: 12.5px; }
.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--primary); border-radius: 3px; }
.hero .bar { background: var(--navy-track); }
.hero .bar i { background: var(--on-navy); }
.stat { display: grid; gap: 2px; align-content: start; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.stat:hover { border-color: var(--line-strong); }
.stat[aria-pressed="true"] { border-color: var(--fg); }
.stat .k { font-size: 12.5px; color: var(--muted); font-weight: 460; }
.stat .v { font-family: var(--mono); font-size: 26px; font-weight: 540; line-height: 1.25; }
.stat .v.hot { color: var(--red-text); }
.stat .s { font-size: 12px; color: var(--muted); }
@media (max-width: 860px) { .summary { grid-template-columns: repeat(3, minmax(0, 1fr)); } .hero { grid-column: 1 / -1; } .stat { padding: 11px 12px; } .stat .v { font-size: 22px; } }
/* board */
.board { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 372px; align-items: start; }
@media (max-width: 1040px) { .board { grid-template-columns: minmax(0, 1fr); } }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.cal { padding: 14px 16px 16px; display: grid; gap: 12px; }
.cal-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; justify-content: space-between; }
.month { display: flex; align-items: center; gap: 6px; }
.month h2 { font-size: 18px; font-weight: 640; min-width: 112px; text-align: center; }
.icon { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); display: inline-grid; place-items: center; color: var(--muted); }
.icon:hover { color: var(--fg); border-color: var(--line-strong); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.fchip { padding: 3px 10px; border-radius: 999px; font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); background: var(--surface); }
.fchip:hover { color: var(--fg); }
.fchip[aria-pressed="true"] { background: var(--tint); color: var(--tint-fg); border-color: var(--tint-fg); font-weight: 540; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 14px; height: 9px; border-radius: 2px; background: var(--tint); }
.legend i.m { background: var(--navy); }
.legend i.o { background: var(--red-soft); box-shadow: inset 0 0 0 1px var(--red); }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.dow { padding: 5px 0; text-align: center; font-size: 12px; color: var(--muted); background: var(--sunken); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.cell { min-height: 112px; padding: 5px; display: flex; flex-direction: column; gap: 3px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: pointer; min-width: 0; }
.cell:hover { background: var(--sunken); }
.cell.out .num { color: var(--faint); }
.cell.out .chip { opacity: .55; }
.cell.sel { background: var(--select); }
.num { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-size: 12.5px; flex: none; text-align: center; }
.cell.today .num { background: var(--primary); color: var(--on-primary); font-weight: 540; }
.chip { display: block; width: 100%; padding: 2px 5px; border-radius: 4px; font-size: 11.5px; line-height: 1.45; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; background: var(--tint); color: var(--tint-fg); }
.chip b { font-family: var(--mono); font-weight: 460; font-size: 10px; opacity: .75; margin-right: 3px; }
.chip.m { background: var(--navy); color: var(--on-navy); font-weight: 540; }
.chip.m.sel { box-shadow: 0 0 0 2px var(--line-strong); }
.chip.over { background: var(--red-soft); color: var(--red-text); box-shadow: inset 0 0 0 1px var(--red); }
.chip.closed { background: transparent; color: var(--faint); text-decoration: line-through; }
.chip:hover { filter: brightness(.96); }
.more { font-size: 11px; color: var(--muted); padding-left: 5px; text-align: left; }
.more:hover { color: var(--fg); text-decoration: underline; }
@media (max-width: 720px) {
.cal { padding: 12px 10px 12px; }
.cell { min-height: 62px; padding: 3px; gap: 2px; align-items: center; }
.chip { height: 5px; padding: 0; font-size: 0; border-radius: 2px; pointer-events: none; background: var(--faint); }
.chip b { display: none; }
.chip.m { background: var(--fg); }
.chip.over { background: var(--red); box-shadow: none; }
.chip.closed { background: var(--line-strong); }
.more { display: none; }
}
/* panel */
.panel { padding: 16px; display: grid; gap: 14px; }
@media (min-width: 1041px) { .panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 66px); max-height: calc(100vh - 82px); overflow-y: auto; } }
.p-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.p-head h2 { font-size: 16px; font-weight: 640; line-height: 1.35; }
.sub { font-size: 12.5px; color: var(--muted); }
.sec { font-size: 12.5px; font-weight: 540; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.stack { display: grid; gap: 8px; }
.row { display: grid; gap: 5px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); width: 100%; min-width: 0; }
.row:hover { border-color: var(--line-strong); }
.row .t { font-weight: 540; line-height: 1.4; overflow-wrap: anywhere; }
.row .r1, .row .r2 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.row .r2 { justify-content: space-between; }
.code { font-family: var(--mono); font-size: 11.5px; font-weight: 540; padding: 0 6px; border-radius: 4px; background: var(--sunken); }
.proj { font-size: 12px; color: var(--muted); }
.pill { display: inline-block; font-size: 11.5px; font-weight: 460; padding: 1px 8px; border-radius: 5px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.pill.on { background: var(--tint); color: var(--tint-fg); }
.pill.closed { background: var(--done-soft); color: var(--done); }
.pill.free { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); }
.pill.ex { background: transparent; color: var(--faint); box-shadow: inset 0 0 0 1px var(--line); font-size: 10.5px; padding: 0 5px; }
.due { font-size: 12px; color: var(--muted); white-space: nowrap; }
.due b { font-family: var(--mono); font-weight: 540; color: var(--fg); }
.due.hot, .due.hot b { color: var(--red-text); }
.avs { display: inline-flex; align-items: center; }
.av { width: 22px; height: 22px; border-radius: 50%; background: var(--sunken); color: var(--muted); display: inline-grid; place-items: center; font-size: 11px; font-weight: 540; box-shadow: 0 0 0 2px var(--surface); }
.av + .av { margin-left: -5px; }
.av.me { background: var(--primary); color: var(--on-primary); }
.ms .pct { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.empty { padding: 26px 12px; text-align: center; color: var(--muted); font-size: 13px; display: grid; gap: 8px; justify-items: center; }
.empty strong { color: var(--fg); font-size: 14px; }
.hist { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
/* tasks + projects */
.cat { display: grid; gap: 10px; }
.cat h2 { font-size: 18px; font-weight: 640; }
.cat h2 span { font-family: var(--mono); color: var(--muted); font-size: 14px; font-weight: 460; margin-left: 6px; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); }
.card { display: grid; grid-template-rows: auto 1fr auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; width: 100%; }
.card:hover { border-color: var(--line-strong); }
.card .band { display: flex; align-items: center; gap: 7px; padding: 6px 12px; background: var(--sunken); flex-wrap: wrap; }
.card .band .code { background: var(--surface); }
.card .band .c { font-size: 12px; font-weight: 540; color: var(--muted); }
.card .body { padding: 12px; font-size: 15.5px; font-weight: 540; line-height: 1.4; overflow-wrap: anywhere; }
.card .foot { padding: 0 12px 11px; display: grid; gap: 7px; }
.card .foot > span { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.pgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.pcard { padding: 16px; display: grid; gap: 12px; align-content: start; }
.pcard h2 { font-size: 18px; font-weight: 640; }
.nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.nums div { display: grid; }
.nums b { font-family: var(--mono); font-size: 20px; font-weight: 540; }
.nums b.hot { color: var(--red-text); }
.nums span { font-size: 12px; color: var(--muted); }
/* issue detail */
.doc { width: 100%; max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
.back { color: var(--muted); font-size: 13px; justify-self: start; }
.back:hover { color: var(--fg); }
.doc-head { display: grid; gap: 7px; }
.doc-head h1 { font-size: 24px; font-weight: 640; line-height: 1.3; overflow-wrap: anywhere; }
.takers { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.takers .av { width: 32px; height: 32px; font-size: 13px; }
.plus { display: inline-flex; align-items: center; gap: 7px; font-weight: 540; font-size: 13px; }
.plus i { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--fg); display: grid; place-items: center; font-style: normal; font-size: 17px; line-height: 1; }
.block { padding: 16px; display: grid; gap: 10px; }
.block h2 { font-size: 15px; font-weight: 640; display: flex; justify-content: space-between; gap: 8px; }
.block h2 span { font-family: var(--mono); font-weight: 460; color: var(--muted); font-size: 13px; }
.bul { display: grid; gap: 3px; padding-left: 18px; list-style: disc; }
.check { display: flex; gap: 9px; align-items: flex-start; padding: 7px 0; border-top: 1px solid var(--line); }
.check:first-child { border-top: 0; }
.check input { width: 16px; height: 16px; margin: 3px 0 0; flex: none; accent-color: var(--primary); }
.check.done span { color: var(--muted); text-decoration: line-through; }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.step { padding: 10px 6px; border: 1px solid var(--line); border-radius: 8px; text-align: center; font-size: 12.5px; color: var(--muted); }
.step:not([disabled]):hover { border-color: var(--fg); }
.step[disabled] { cursor: default; }
.step.past { color: var(--fg); background: var(--sunken); }
.step.now { color: var(--fg); font-weight: 640; border: 2px solid var(--fg); padding: 9px 5px; }
.step small { display: block; font-weight: 390; font-size: 11px; color: var(--muted); }
.msg { display: grid; gap: 2px; padding: 8px 0; border-top: 1px solid var(--line); }
.msg:first-child { border-top: 0; }
.msg .by { font-size: 12px; color: var(--muted); }
.msg p { white-space: pre-wrap; overflow-wrap: anywhere; }
textarea, input[type="text"], input[type="search"], input[type="date"], select { width: 100%; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); min-width: 0; }
textarea { resize: vertical; min-height: 66px; }
.compose { display: grid; gap: 7px; justify-items: end; }
/* dialog */
dialog { border: 0; border-radius: 12px; padding: 0; background: var(--surface); color: var(--fg); width: min(540px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 18px 50px rgba(15, 20, 40, .28); }
dialog::backdrop { background: rgba(15, 20, 40, .45); }
.form { padding: 20px; display: grid; gap: 13px; }
.form h2 { font-size: 18px; font-weight: 640; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > label, .field > .lb { font-size: 12.5px; font-weight: 540; }
.field small { font-size: 12px; color: var(--muted); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.picker { max-height: 196px; overflow-y: auto; border: 1px solid var(--line); border-radius: 7px; }
.pick { display: flex; align-items: flex-start; gap: 9px; padding: 7px 10px; border-top: 1px solid var(--line); cursor: pointer; }
.pick:first-child { border-top: 0; }
.pick input { margin-top: 3px; accent-color: var(--primary); flex: none; }
.pick span { min-width: 0; overflow-wrap: anywhere; }
.pick small { display: block; }
.form-foot { display: flex; justify-content: flex-end; gap: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 20; max-width: calc(100vw - 32px); background: var(--primary); color: var(--on-primary); padding: 8px 14px; border-radius: 8px; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
.vids { display: grid; gap: 12px; }
.vid { margin: 0; display: grid; gap: 6px; }
.vid video { display: block; width: 100%; max-height: 440px; border-radius: 8px; background: #000; }
.vid figcaption { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; font-size: 12.5px; color: var(--muted); }
.vid figcaption span { min-width: 0; overflow-wrap: anywhere; }
.vid-err { padding: 22px 12px; text-align: center; font-size: 13px; color: var(--muted); background: var(--sunken); border-radius: 8px; }
.vid-up { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.login { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: var(--bg); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-y: auto; }
.login form { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; padding: 24px; display: grid; gap: 14px; }
.login h1 { font-size: 22px; font-weight: 640; }
.login p { color: var(--muted); }
.login label { display: grid; gap: 4px; font-size: 13px; font-weight: 540; }
.login input { width: 100%; padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); }
.login .err { color: var(--red-text); font-size: 13px; }
.login .btn { width: 100%; padding: 10px; }
</style>
<style>[hidden]{display:none!important}body{margin:0}</style>

<script>

/* 판정 */
const closed = i => (i.step || 0) >= 3;

const status = i => closed(i) ? ['닫힘', 'closed'] : i.step === 2 ? ['수정 완료', 'on'] : i.step === 1 ? ['담당자 확인 완료', 'on'] : takers(i).length ? ['내용 확인 중', 'on'] : ['열림', 'free'];

function avatars(i) {

function calendar() {

}
function openIssue() {
const defDate = S.sel.type === 'date' ? S.sel.id : '';
dlg.innerHTML = `<form class="form" id="iss-form"><h2>이슈 등록</h2>
<div class="field"><label for="i-title">제목</label><input type="text" id="i-title" required maxlength="80" placeholder="예: 로그인 화면 수정"></div>
<div class="two"><div class="field"><label for="i-project">프로젝트</label><select id="i-project">${PROJECTS.map(p => `<option>${p}</option>`).join('')}</select></div>
<div class="field"><label for="i-cat">분류</label><select id="i-cat">${Object.keys(CATS).map(c => `<option value="${c}">${c}</option>`).join('')}</select></div></div>
<div class="two"><div class="field"><label for="i-due">마감일</label><input type="date" id="i-due" required value="${defDate}"></div>
<div class="field"><label for="i-ms">주요 마감에 연결</label><select id="i-ms"><option value="">연결하지 않음</option>${S.milestones.slice().sort((a, b) => a.date.localeCompare(b.date)).map(m => `<option value="${esc(m.id)}">${esc(m.title)} (${md(m.date)})</option>`).join('')}</select></div></div>
<div class="field"><label for="i-problem">어떤 문제인가요?</label><textarea id="i-problem" placeholder="한 줄에 하나씩 적어 주세요"></textarea></div>
<div class="field"><label for="i-crit">이렇게 되면 끝나요</label><textarea id="i-crit" placeholder="완료 조건을 한 줄에 하나씩 적어 주세요"></textarea></div>
<small class="sub">담당자는 지정하지 않아요. 등록하면 팀 전체에 공개되고, 팀원이 직접 맡아요.</small>
<div class="form-foot"><button type="button" class="btn" data-act="dlg-close">취소</button><button class="btn primary">등록</button></div></form>`;
dlg.showModal();
}
const lines = s => s.split('\n').map(x => x.trim()).filter(Boolean);
document.addEventListener('submit', async e => {
e.preventDefault();
if (e.target.id === 'ms-form') {
const data = { title: $('#m-title').value.trim(), project: $('#m-project').value, date: $('#m-date').value, issueIds: [...pick] };
if (!data.title || !data.date) return;
if (editing) {
const ch = [];
if (editing.date !== data.date) ch.push(`마감일 ${md(editing.date)} → ${md(data.date)}`);
if (editing.title !== data.title) ch.push('제목 변경');
if ((editing.issueIds || []).slice().sort().join() !== data.issueIds.slice().sort().join()) ch.push(`연결 이슈 ${data.issueIds.length}개로 변경`);
if (ch.length && S.me.id) data.history = [...(editing.history || []), { at: new Date().toISOString(), by: S.me.id, text: ch.join(', ') }];
const id = editing.id; dlg.close();
await write(() => msDoc(id).update(data), '주요 마감을 저장했어요');
} else {
const id = newId('m'); dlg.close();
S.sel = { type: 'milestone', id };
await write(() => msDoc(id).set({ ...data, creator: S.me.id, history: [], createdAt: today() }), '주요 마감을 등록했어요');
S.month = new Date(parse(data.date).getFullYear(), parse(data.date).getMonth(), 1); render();
}
}
if (e.target.id === 'iss-form') {
const title = $('#i-title').value.trim(), due = $('#i-due').value;
if (!title || !due) return;
const nums = S.issues.map(i => parseInt((i.code || '').replace(/\D/g, ''), 10) || 0);
const code = 'PR-' + String(Math.max(0, ...nums) + 1).padStart(3, '0'), id = newId('i');
const doc = { code, title, project: $('#i-project').value, category: $('#i-cat').value, due, createdAt: today(), step: 0, takers: [], creator: S.me.id, problem: lines($('#i-problem').value), criteria: lines($('#i-crit').value).map(text => ({ text, done: false })) };
const mid = $('#i-ms').value; dlg.close();
await write(() => issDoc(id).set(doc), `${code} 이슈를 등록했어요`);
if (mid) { const m = S.milestones.find(x => x.id === mid); if (m) await write(() => msDoc(mid).update({ issueIds: [...(m.issueIds || []), id] })); }
}
});
document.addEventListener('input', e => { if (e.target.id === 'm-search' || e.target.id === 'm-project') pickList(); });
document.addEventListener('change', e => {
if (e.target.dataset.pick) { e.target.checked ? pick.add(e.target.dataset.pick) : pick.delete(e.target.dataset.pick); $('#m-count').textContent = `${pick.size}개 선택됨`; }
if (e.target.id === 'm-project') pickList();
if (e.target.id === 'vid-file') uploadVideo(e.target.files[0]);
if (e.target.dataset.act === 'crit') {
const i = S.issues.find(x => x.id === curIssue); if (!i) return;
const crit = (i.criteria || []).map((c, k) => k === +e.target.dataset.id ? { ...c, done: e.target.checked } : { ...c });
write(() => issDoc(i.id).update({ criteria: crit }));
}
});
document.addEventListener('keydown', e => {
if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.id === 'chat-text') send('chat');
if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.id === 'memo-text') send('memo');
});
function send(kind) {
const t = document.getElementById(kind + '-text'), text = t?.value.trim(); if (!text) return;
const issueId = curIssue, c = { issueId, kind, text, by: S.me.id, at: new Date().toISOString() };
t.value = '';
write(() => S.db.doc('comments/' + newId('c')).set(c));
}
/* 클릭 */
document.addEventListener('click', async e => {
const el = e.target.closest('[data-act]'); if (!el) return;
const a = el.dataset.act, id = el.dataset.id;
if (a === 'crit') return;
const cur = curIssue && S.issues.find(x => x.id === curIssue);
switch (a) {
case 'nav': go(id); break;
case 'back': go(S.from); break;
case 'issue': go('issue-' + id); break;
case 'milestone':
if (S.route !== 'calendar') { S.from = 'calendar'; S.sel = { type: 'milestone', id }; go('calendar'); break; }
S.sel = { type: 'milestone', id }; S.confirm = null; render(); scrollPanel(); break;
case 'date': S.sel = { type: 'date', id }; S.confirm = null; render(); scrollPanel(); break;
case 'list': S.sel = S.sel.type === 'list' && S.sel.id === id ? { type: 'home' } : { type: 'list', id }; render(); scrollPanel(); break;
case 'home': S.sel = { type: 'home' }; S.confirm = null; render(); break;
case 'prev': S.month = new Date(S.month.getFullYear(), S.month.getMonth() - 1, 1); render(); break;
case 'next': S.month = new Date(S.month.getFullYear(), S.month.getMonth() + 1, 1); render(); break;
case 'thismonth': { const d = new Date(); S.month = new Date(d.getFullYear(), d.getMonth(), 1); S.sel = { type: 'date', id: today() }; render(); break; }
case 'kind': S.kind = id; render(); break;
case 'proj': S.project = id; render(); break;
case 'openonly': S.openOnly = !S.openOnly; render(); break;
case 'tproj': S.taskProject = id; render(); break;
case 'topen': S.taskOpen = !S.taskOpen; render(); break;
case 'p-cal': S.project = id; go('calendar'); break;
case 'p-task': S.taskProject = id; go('tasks'); break;
case 'new-ms': openMs(); break;
case 'new-issue': openIssue(); break;
case 'ms-edit': openMs(S.milestones.find(x => x.id === id)); break;
case 'dlg-close': dlg.close(); break;
case 'ms-del': S.confirm = id; render(); break;
case 'ms-del-yes': S.confirm = null; S.sel = { type: 'home' }; await write(() => msDoc(id).delete(), '주요 마감을 삭제했어요'); break;
case 'confirm-no': S.confirm = null; render(); break;
case 'iss-del': S.confirm = curIssue; render(); break;
case 'iss-del-yes': {
const iid = curIssue, ms = milestonesOf(cur); S.confirm = null; go(S.from);
await write(() => issDoc(iid).delete(), '이슈를 삭제했어요');
if ((cur.videos || []).length) window.__videos.remove(cur.videos.map(v => v.path)).catch(() => {});
for (const m of ms) await write(() => msDoc(m.id).update({ issueIds: m.issueIds.filter(x => x !== iid) }));
for (const c of S.comments.filter(c => c.issueId === iid)) await write(() => S.db.doc('comments/' + c.id).delete());
break;
}
case 'ex-del': S.confirm = 'examples'; render(); break;
case 'ex-del-yes': {
const iss = S.issues.filter(i => i.example), ms = S.milestones.filter(m => m.example); S.confirm = null; S.sel = { type: 'home' };
for (const m of ms) await write(() => msDoc(m.id).delete());
for (const i of iss) {
await write(() => issDoc(i.id).delete());
if ((i.videos || []).length) window.__videos.remove(i.videos.map(v => v.path)).catch(() => {});
for (const c of S.comments.filter(c => c.issueId === i.id)) await write(() => S.db.doc('comments/' + c.id).delete());
}
toast('예시를 삭제했어요');
break;
}
case 'take':
if (!S.me.id) { toast('로그인해야 이슈를 맡을 수 있어요.'); break; }
await write(() => issDoc(cur.id).update({ takers: [...(cur.takers || []), S.me.id] }), '이슈를 맡았어요'); break;
case 'untake': await write(() => issDoc(cur.id).update({ takers: (cur.takers || []).filter(x => x !== S.me.id) }), '맡기를 취소했어요'); break;
case 'step': await write(() => issDoc(cur.id).update({ step: +id })); break;
case 'vid-del': S.confirm = 'v:' + id; render(); break;
case 'vid-del-yes': {
S.confirm = null;
const ok = await write(() => issDoc(cur.id).update({ videos: (cur.videos || []).filter(v => v.path !== id) }), '영상을 삭제했어요');
if (ok) { delete vidCache[id]; window.__videos.remove([id]).catch(() => {}); }
render(); break;
}
case 'send': send(id); break;
case 'logout': await window.__logout(); break;
}
});
function scrollPanel() { if (innerWidth <= 1040) { const p = $('#panel'); if (p) p.scrollIntoView({ block: 'start', behavior: 'smooth' }); } }
/* 연결 */
function refreshNames() {
if (!S.user) return;
const ids = new Set();
S.issues.forEach(i => { (i.takers || []).forEach(x => ids.add(x)); if (i.creator) ids.add(i.creator); });
S.milestones.forEach(m => { if (m.creator) ids.add(m.creator); (m.history || []).forEach(h => ids.add(h.by)); });
S.comments.forEach(c => c.by && ids.add(c.by));
const list = [...ids]; if (!list.length) return;
S.user.profiles(list).then(ps => {
let changed = false;
list.forEach(id => { const n = ps[id]?.name || ''; if (n && S.names[id] !== n) { S.names[id] = n; changed = true; } });
if (changed) render();
});
}
async function boot() {
render();
const use = window.claude && window.claude.use ? n => window.claude.use(n) : async () => null;
const [db, user] = await Promise.all([use('db'), use('user')]);
S.user = user;
if (user) {
const me = await user.me();
S.me = { id: me.id, name: me.name }; S.canEdit = !!me.canEdit;
const w = await user.can('data.write');
S.canWrite = w;
}
if (!db) { S.load = 'none'; render(); return; }
S.db = db;
const timer = setTimeout(() => { if (S.load === 'loading') { S.load = 'slow'; render(); } }, 10000);
const seen = {};
const sub = (name, key) => db.collection(name).onSnapshot(snap => {
S[key] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
if (!snap.metadata.fromCache) seen[key] = true;
if (seen.issues && seen.milestones && seen.comments) { clearTimeout(timer); S.load = 'ok'; }
else if (S.load === 'loading' && snap.docs.length) { /* 저장된 사본을 먼저 표시 */ }
render(); refreshNames();
}, () => { clearTimeout(timer); S.load = 'error'; render(); });
sub('issues', 'issues'); sub('milestones', 'milestones'); sub('comments', 'comments');
}
boot();
</script>
</body>
</html>
