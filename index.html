<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IssueCanvas</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
/* Layout: 왼쪽 네이비 사이드바 + 오른쪽 작업 영역. 대시보드는 마감 캘린더(왼쪽)와 팀 상태·선택 날짜·이번 주 일정(오른쪽 열). 팀 일정은 월~일 주간 보드와 오른쪽 상세 패널. */
:root {
--bg: #F7F8FA; --surface: #FFFFFF; --sunken: #F2F4F7; --line: #E7EAF0; --line-strong: #D3D9E3;
--fg: #101B3D; --muted: #5A6478; --faint: #8E97A9;
--side: #0C1A52; --side-fg: #FFFFFF; --side-muted: #AEBCE8; --side-line: rgba(255,255,255,.38); --side-hover: rgba(255,255,255,.09);
--navy: #0F2A78; --on-navy: #FFFFFF; --on-navy-soft: #C9D6FF; --navy-track: #2F4CA3;
--primary: #0F2A78; --on-primary: #FFFFFF;
--tint: #EAF0FF; --tint-fg: #173A9C; --select: #E6EDFF;
--red: #EF3B42; --red-text: #D1222A; --red-soft: #FFEDEE;
--blue: #2563EB; --blue-bg: #E8F0FF; --violet: #7C3AED; --violet-bg: #F1EBFF; --amber: #B45309; --amber-bg: #FFF2D9;
--green: #0E8A5F; --green-bg: #E1F7EE; --pink: #DB2777; --pink-bg: #FDEAF3; --cyan: #0E7490; --cyan-bg: #DFF6FA;
--orange: #EA580C; --orange-bg: #FFEEE4; --sky: #0369A1; --sky-bg: #E0F1FC; --lime: #4D7C0F; --lime-bg: #ECF8DA; --slate: #475569; --slate-bg: #EEF1F5;
--sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
--side-w: 232px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
--bg: #0B1020; --surface: #131A30; --sunken: #0F1528; --line: #252E4D; --line-strong: #3A4570;
--fg: #EEF2FF; --muted: #A9B3D0; --faint: #7F8AAD;
--side: #0A1648; --side-fg: #FFFFFF; --side-muted: #A9BAF0; --side-line: rgba(255,255,255,.3); --side-hover: rgba(255,255,255,.08);
--navy: #1C3A9E; --on-navy: #FFFFFF; --on-navy-soft: #C9D6FF; --navy-track: #3F5CC0;
--primary: #DCE6FF; --on-primary: #0B1530;
--tint: #1C2A5A; --tint-fg: #C9D6FF; --select: #223270;
--red: #FF5C62; --red-text: #FF8085; --red-soft: #3A1622;
--blue: #8FB4FF; --blue-bg: #1A2B57; --violet: #C4A8FF; --violet-bg: #2D2152; --amber: #FFC66B; --amber-bg: #3A2A12;
--green: #5FDDAA; --green-bg: #12352A; --pink: #FF8DC0; --pink-bg: #3E1830; --cyan: #6FE0F0; --cyan-bg: #123540;
--orange: #FFA06B; --orange-bg: #3E2214; --sky: #7CCBFF; --sky-bg: #12304A; --lime: #B5E36A; --lime-bg: #24361A; --slate: #B6C1D6; --slate-bg: #222B40;
color-scheme: dark;
} }
:root[data-theme="dark"] {
--bg: #0B1020; --surface: #131A30; --sunken: #0F1528; --line: #252E4D; --line-strong: #3A4570;
--fg: #EEF2FF; --muted: #A9B3D0; --faint: #7F8AAD;
--side: #0A1648; --side-fg: #FFFFFF; --side-muted: #A9BAF0; --side-line: rgba(255,255,255,.3); --side-hover: rgba(255,255,255,.08);
--navy: #1C3A9E; --on-navy: #FFFFFF; --on-navy-soft: #C9D6FF; --navy-track: #3F5CC0;
--primary: #DCE6FF; --on-primary: #0B1530;
--tint: #1C2A5A; --tint-fg: #C9D6FF; --select: #223270;
--red: #FF5C62; --red-text: #FF8085; --red-soft: #3A1622;
--blue: #8FB4FF; --blue-bg: #1A2B57; --violet: #C4A8FF; --violet-bg: #2D2152; --amber: #FFC66B; --amber-bg: #3A2A12;
--green: #5FDDAA; --green-bg: #12352A; --pink: #FF8DC0; --pink-bg: #3E1830; --cyan: #6FE0F0; --cyan-bg: #123540;
--orange: #FFA06B; --orange-bg: #3E2214; --sky: #7CCBFF; --sky-bg: #12304A; --lime: #B5E36A; --lime-bg: #24361A; --slate: #B6C1D6; --slate-bg: #222B40;
color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 390 14px/1.55 var(--sans); font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
h1, h2, h3, p, ul, figure { margin: 0; padding: 0; }
ul { list-style: none; }
h1, h2, h3 { text-wrap: balance; letter-spacing: -0.015em; }
b, strong { font-weight: 560; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* 색 묶음 */
.c-blue { --c: var(--blue); --cb: var(--blue-bg); } .c-violet { --c: var(--violet); --cb: var(--violet-bg); }
.c-amber { --c: var(--amber); --cb: var(--amber-bg); } .c-green { --c: var(--green); --cb: var(--green-bg); }
.c-pink { --c: var(--pink); --cb: var(--pink-bg); } .c-cyan { --c: var(--cyan); --cb: var(--cyan-bg); }
.c-orange { --c: var(--orange); --cb: var(--orange-bg); } .c-sky { --c: var(--sky); --cb: var(--sky-bg); }
.c-lime { --c: var(--lime); --cb: var(--lime-bg); } .c-slate { --c: var(--slate); --cb: var(--slate-bg); }
.c-red { --c: var(--red-text); --cb: var(--red-soft); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 520; padding: 1px 8px; border-radius: 999px; background: var(--cb, var(--sunken)); color: var(--c, var(--muted)); white-space: nowrap; line-height: 1.6; }
.tag.line { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--muted); }
.tag.ex { background: transparent; color: var(--faint); box-shadow: inset 0 0 0 1px var(--line); font-size: 10.5px; padding: 0 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; display: inline-block; }

/* 사이드바 */
.side { position: fixed; inset: 0 auto 0 0; width: var(--side-w); background: var(--side); color: var(--side-fg); display: flex; flex-direction: column; padding: calc(26px + env(safe-area-inset-top, 0px)) 0 calc(16px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px)); z-index: 40; overflow-y: auto; }
.logo { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 640; letter-spacing: -0.02em; padding-right: 22px; margin-bottom: 26px; }
.logo svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
.side-tools { display: grid; gap: 8px; padding-right: 22px; margin-bottom: 26px; position: relative; }
.side-btn, .side-search { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 34px; padding: 0 10px; border: 1px solid var(--side-line); border-radius: 4px; color: var(--side-fg); font-size: 12.5px; width: 100%; background: transparent; }
.side-btn:hover { background: var(--side-hover); }
.side-search input[type="search"] { background: transparent; border: 0; border-radius: 0; outline: 0; color: var(--side-fg); width: 100%; min-width: 0; font-size: 12.5px; padding: 0; -webkit-appearance: none; appearance: none; }
.side-search input::placeholder { color: var(--side-muted); }
.side-search:focus-within { border-color: var(--side-fg); }
.side-search svg.i, .side-btn svg.i { width: 15px; height: 15px; }
.nav { display: grid; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 11px; height: 40px; padding: 0 12px; border-radius: 6px 0 0 6px; color: var(--side-fg); font-size: 14px; font-weight: 460; }
.nav button:hover { background: var(--side-hover); }
.nav button[aria-current="page"] { background: var(--surface); color: var(--tint-fg); font-weight: 560; }
.nav .badge { min-width: 17px; height: 17px; padding: 0 5px; border-radius: 999px; background: var(--red); color: #FFF; font-size: 10.5px; font-weight: 600; display: inline-grid; place-items: center; }
.side-foot { margin-top: auto; padding: 18px 22px 0 12px; font-size: 11.5px; color: var(--side-muted); }
.menu { position: absolute; z-index: 60; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 14px 40px rgba(10, 20, 60, .22); padding: 6px; display: grid; min-width: 220px; }
.menu button { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px; font-size: 13.5px; text-align: left; }
.menu button:hover, .menu button.on { background: var(--sunken); }
.menu small { color: var(--muted); font-size: 11.5px; display: block; }
.side .menu { left: 0; right: 22px; top: 40px; }
.search-res { top: 82px; left: 0; right: 22px; max-height: 60vh; overflow-y: auto; }
.search-res .k { font-size: 11px; color: var(--muted); padding: 6px 10px 2px; }
.scrim { position: fixed; inset: 0; background: rgba(10, 16, 40, .45); z-index: 35; }

/* 본문 */
.app { margin-left: var(--side-w); min-height: 100vh; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); display: flex; align-items: center; gap: 12px; padding: 14px max(28px, env(safe-area-inset-right, 0px)) 6px 28px; }
.top .mobile { display: none; align-items: center; gap: 10px; }
.top h1 { font-size: 15px; font-weight: 560; color: var(--muted); }
.me-chip { margin-left: auto; display: flex; align-items: center; gap: 10px; font-weight: 520; padding: 4px 4px 4px 10px; border-radius: 999px; }
.me-chip:hover { background: var(--sunken); }
.icon-btn { width: 36px; height: 36px; border-radius: 8px; display: inline-grid; place-items: center; color: var(--fg); position: relative; }
.icon-btn:hover { background: var(--sunken); }
.icon-btn .badge { position: absolute; top: 3px; right: 2px; min-width: 15px; height: 15px; border-radius: 999px; background: var(--red); color: #FFF; font-size: 9.5px; display: grid; place-items: center; padding: 0 4px; }
main { padding: 10px max(28px, env(safe-area-inset-right, 0px)) 56px 28px; display: grid; gap: 16px; max-width: 1480px; }
@media (max-width: 900px) {
.side { transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.3); }
body.side-open .side { transform: none; }
.app { margin-left: 0; }
.top { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 8px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.top .mobile { display: flex; }
.top h1 { display: none; }
.me-chip .nm { display: none; }
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

.head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
.head h1 { font-size: 26px; font-weight: 640; line-height: 1.25; }
.head p { color: var(--muted); margin-top: 2px; }
.head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.sec-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sec-title small { font-size: 12px; color: var(--muted); font-weight: 400; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 7px; font-weight: 540; font-size: 13.5px; border: 1px solid var(--line-strong); background: var(--surface); white-space: nowrap; }
.btn:hover { border-color: var(--fg); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.primary:hover { opacity: .9; }
.btn.danger { color: var(--red-text); border-color: var(--red); background: transparent; }
.btn.small { padding: 4px 10px; font-size: 12.5px; }
.btn.link { border: 0; padding: 0; color: var(--blue); background: none; font-weight: 500; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn svg.i { width: 15px; height: 15px; }
.notice { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 9px 14px; background: var(--tint); color: var(--tint-fg); border-radius: 8px; font-size: 13px; }
.notice p { flex: 1 1 260px; min-width: 0; }
.notice.alert { background: var(--red-soft); color: var(--red-text); }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.sub { font-size: 12.5px; color: var(--muted); }
.stack { display: grid; gap: 8px; }
.empty { padding: 26px 12px; text-align: center; color: var(--muted); font-size: 13px; display: grid; gap: 8px; justify-items: center; }
.empty strong { color: var(--fg); font-size: 14px; font-weight: 560; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--primary); border-radius: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.fchip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); background: var(--surface); }
.fchip:hover { color: var(--fg); }
.fchip[aria-pressed="true"] { background: var(--cb, var(--tint)); color: var(--c, var(--tint-fg)); border-color: var(--c, var(--tint-fg)); font-weight: 540; }
.fchip .av { width: 18px; height: 18px; font-size: 9.5px; box-shadow: none; }

/* 아바타 */
.av { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10.5px; font-weight: 600; flex: none; overflow: hidden; background: var(--cb); color: var(--c); box-shadow: 0 0 0 2px var(--surface); }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avs { display: inline-flex; align-items: center; }
.avs .av + .av { margin-left: -6px; }

/* 대시보드 */
.dash { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
.dash > div { display: grid; gap: 16px; min-width: 0; }
@media (max-width: 1180px) { .dash { grid-template-columns: minmax(0, 1fr); } }
.summary { display: grid; gap: 10px; grid-template-columns: minmax(0, 1.9fr) repeat(3, minmax(0, 1fr)); }
.hero { display: grid; gap: 10px; align-content: space-between; padding: 16px 18px; border-radius: 12px; background: var(--navy); color: var(--on-navy); width: 100%; min-width: 0; }
.hero[data-act]:hover { box-shadow: 0 0 0 2px var(--line-strong); }
.hero .eyebrow { color: var(--on-navy-soft); font-size: 12px; font-weight: 460; }
.hero .line { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.hero .ti { display: block; font-size: 18px; font-weight: 560; line-height: 1.35; }
.hero .dd { font-weight: 600; font-size: 24px; line-height: 1.1; white-space: nowrap; }
.hero .meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--on-navy-soft); font-size: 12px; }
.hero .bar { background: var(--navy-track); }
.hero .bar i { background: var(--on-navy); }
.stat { display: grid; gap: 2px; align-content: start; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.stat:hover { border-color: var(--line-strong); }
.stat[aria-pressed="true"] { border-color: var(--fg); }
.stat .k { font-size: 12.5px; color: var(--muted); font-weight: 460; }
.stat .v { font-size: 25px; font-weight: 600; line-height: 1.25; }
.stat .v.hot { color: var(--red-text); }
.stat .s { font-size: 12px; color: var(--muted); }
@media (max-width: 860px) { .summary { grid-template-columns: repeat(3, minmax(0, 1fr)); } .hero { grid-column: 1 / -1; } .stat { padding: 11px 12px; } .stat .v { font-size: 21px; } }

.team { padding: 16px; display: grid; gap: 14px; }
.crew { display: grid; gap: 12px; margin-bottom: 20px; }
.crew .sec-title { flex-wrap: wrap; justify-content: flex-start; }
.mcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 14px; }
.mcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; grid-template-rows: auto 1fr auto; gap: 14px; min-height: 176px; min-width: 0; }
.mcard.me { border-color: var(--line-strong); }
.mc-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mc-head > .av { width: 28px; height: 28px; font-size: 12px; }
.mc-name { font-size: 13.5px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mc-st { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 560; color: var(--muted); white-space: nowrap; }
.mc-st i { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--faint)); }
.mc-st.c-line i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }
.mc-now { display: grid; align-content: start; gap: 6px; min-width: 0; }
.mc-label { font-size: 11px; letter-spacing: .02em; color: var(--faint); }
.mc-task { font: inherit; font-size: 17px; line-height: 1.35; font-weight: 650; color: var(--fg); text-align: left; background: none; border: 0; padding: 0; cursor: default; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
button.mc-task { cursor: pointer; }
button.mc-task:hover { text-decoration: underline; text-underline-offset: 3px; }
.mc-none { font-size: 14px; color: var(--faint); }
.mc-done { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mc-edit { justify-self: start; }
@media (max-width: 560px) { .mcard { min-height: 0; padding: 16px; } }
.cw-form { display: grid; gap: 6px; }
.cw-form select, .cw-form input { font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: inherit; width: 100%; min-width: 0; }
#my-status .status-edit { display: grid; gap: 10px; }
.ci-sum { display: grid; gap: 4px; padding: 10px 12px; background: var(--sunken); border-radius: 8px; font-size: 13.5px; }
.ci-task { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; }
#ci-form .chk { align-items: baseline; }
.scope { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
.rep { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; margin-top: 10px; padding: 12px; border: 1px dashed var(--line-strong); border-radius: 10px; }
.rep .f { display: grid; gap: 3px; font-size: 11.5px; color: var(--muted); }
.rep select, .rep input { font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--fg); }
.rep .sub { flex-basis: 100%; }
.wp { display: grid; gap: 6px; }
.ap-test { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding-top: 8px; border-top: 1px solid var(--line); }
.ap-test .sub { flex-basis: 100%; }
.wp-row { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; }
.wp-row input[type="time"] { font: inherit; padding: 5px 6px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: inherit; min-width: 0; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 14px 6px; }
.person { display: grid; justify-items: center; gap: 3px; text-align: center; min-width: 0; }
.person .pic { position: relative; }
.person .pic .av { width: 58px; height: 58px; font-size: 20px; box-shadow: 0 0 0 1px var(--line); }
.person .pic .dot { position: absolute; right: 2px; bottom: 3px; width: 13px; height: 13px; box-shadow: 0 0 0 2.5px var(--surface); }
.person .nm { font-size: 13px; font-weight: 540; margin-top: 3px; }
.person .note { font-size: 11px; color: var(--muted); overflow-wrap: anywhere; line-height: 1.35; }
.person.me .nm::after { content: " (나)"; color: var(--faint); font-weight: 400; font-size: 11px; }
.person button.change { font-size: 11px; color: var(--blue); }
.status-edit { display: grid; gap: 10px; padding: 12px; background: var(--sunken); border-radius: 10px; }

/* 월간 캘린더 */
.cal { padding: 14px 16px 16px; display: grid; gap: 12px; }
.cal-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; justify-content: space-between; }
.month { display: flex; align-items: center; gap: 6px; }
.month h2 { font-size: 18px; font-weight: 640; min-width: 112px; text-align: center; }
.round { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); display: inline-grid; place-items: center; color: var(--muted); }
.round:hover { color: var(--fg); border-color: var(--line-strong); }
.round svg.i { width: 15px; height: 15px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 14px; height: 9px; border-radius: 2px; background: var(--cb); }
.legend i.m { background: var(--navy); }
.legend i.o { background: var(--red-soft); box-shadow: inset 0 0 0 1px var(--red); }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.dow { padding: 5px 0; text-align: center; font-size: 12px; color: var(--muted); background: var(--sunken); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.cell { min-height: 108px; padding: 5px; display: flex; flex-direction: column; gap: 3px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: pointer; min-width: 0; }
.cell:hover { background: var(--sunken); }
.cell.out .num { color: var(--faint); }
.cell.out .chip { opacity: .55; }
.cell.sel { background: var(--select); }
.num { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; flex: none; text-align: center; }
.cell.today .num { background: var(--primary); color: var(--on-primary); font-weight: 600; }
.chip { display: block; width: 100%; padding: 2px 6px; border-radius: 5px; font-size: 11.5px; line-height: 1.45; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; background: var(--cb); color: var(--c); text-align: left; }
.chip b { font-weight: 560; font-size: 10px; opacity: .85; margin-right: 3px; }
.chip.m { background: var(--navy); color: var(--on-navy); font-weight: 540; }
.chip.m.sel { box-shadow: 0 0 0 2px var(--blue); }
.chip.over { background: var(--red-soft); color: var(--red-text); box-shadow: inset 0 0 0 1px var(--red); }
.chip.closed { background: transparent; color: var(--faint); text-decoration: line-through; }
.chip.team-ev { background: transparent; color: var(--c); box-shadow: inset 0 0 0 1px var(--cb); }
.more { font-size: 11px; color: var(--muted); padding-left: 5px; text-align: left; }
.more:hover { color: var(--fg); text-decoration: underline; }
@media (max-width: 720px) {
.cal { padding: 12px 10px; }
.cell { min-height: 60px; padding: 3px; gap: 2px; align-items: center; }
.chip { height: 5px; padding: 0; font-size: 0; border-radius: 2px; pointer-events: none; background: var(--c); }
.chip b { display: none; }
.chip.m { background: var(--fg); }
.chip.over { background: var(--red); box-shadow: none; }
.chip.closed { background: var(--line-strong); }
.more { display: none; }
}

/* 패널·행 */
.panel { padding: 16px; display: grid; gap: 14px; }
.p-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.p-head h2 { font-size: 16px; font-weight: 640; line-height: 1.35; }
.sec { font-size: 12.5px; font-weight: 560; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.row { display: grid; gap: 5px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); width: 100%; min-width: 0; text-align: left; }
.row:hover { border-color: var(--line-strong); }
.row .t { font-weight: 560; line-height: 1.4; overflow-wrap: anywhere; }
.row .r1, .row .r2 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.row .r2 { justify-content: space-between; }
.row.cancelled .t { text-decoration: line-through; color: var(--muted); }
.code { font-size: 11.5px; font-weight: 600; padding: 0 6px; border-radius: 4px; background: var(--sunken); }
.proj { font-size: 12px; color: var(--muted); }
.due { font-size: 12px; color: var(--muted); white-space: nowrap; }
.due b { font-weight: 600; color: var(--fg); }
.due.hot, .due.hot b { color: var(--red-text); }
.pct { font-size: 12px; color: var(--muted); white-space: nowrap; }
.hist { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.mini-ev { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: center; padding: 8px 10px; border-radius: 9px; background: var(--cb); color: var(--fg); text-align: left; width: 100%; }
.mini-ev:hover { box-shadow: inset 0 0 0 1px var(--c); }
.mini-ev .when { font-size: 11.5px; color: var(--c); font-weight: 560; white-space: nowrap; }
.mini-ev .what { font-size: 13px; font-weight: 520; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-ev .who { grid-column: 2; display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); min-width: 0; }
.counts { display: flex; flex-wrap: wrap; gap: 6px; }

/* 이슈·마감 */
.ms-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.cat { display: grid; gap: 10px; }
.cat h2 { font-size: 17px; font-weight: 640; display: flex; align-items: center; gap: 8px; }
.cat h2 span.n { color: var(--muted); font-size: 14px; font-weight: 460; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); }
.card { display: grid; grid-template-rows: auto 1fr auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; width: 100%; text-align: left; }
.card:hover { border-color: var(--line-strong); }
.card .band { display: flex; align-items: center; gap: 6px; padding: 8px 12px 0; flex-wrap: wrap; }
.card .body { padding: 8px 12px 10px; font-size: 15.5px; font-weight: 560; line-height: 1.4; overflow-wrap: anywhere; }
.card .foot { padding: 10px 12px 11px; display: grid; gap: 7px; border-top: 1px solid var(--line); background: var(--sunken); }
.card .foot > span { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.pgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.pcard { padding: 16px; display: grid; gap: 12px; align-content: start; }
.pcard h2 { font-size: 18px; font-weight: 640; display: flex; gap: 8px; align-items: center; }
.nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.nums div { display: grid; }
.nums b { font-size: 20px; font-weight: 600; }
.nums b.hot { color: var(--red-text); }
.nums span { font-size: 12px; color: var(--muted); }

/* 이슈 상세 */
.doc { width: 100%; max-width: 780px; margin: 0 auto; display: grid; gap: 14px; }
.back { color: var(--muted); font-size: 13px; justify-self: start; }
.back:hover { color: var(--fg); }
.doc-head { display: grid; gap: 7px; }
.doc-head h1 { font-size: 24px; font-weight: 640; line-height: 1.3; overflow-wrap: anywhere; }
.takers { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.takers .av { width: 32px; height: 32px; font-size: 13px; }
.plus { display: inline-flex; align-items: center; gap: 7px; font-weight: 540; font-size: 13px; }
.plus i { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--fg); display: grid; place-items: center; font-style: normal; font-size: 17px; line-height: 1; }
.block { padding: 16px; display: grid; gap: 10px; }
.block h2 { font-size: 15px; font-weight: 640; display: flex; justify-content: space-between; gap: 8px; }
.block h2 span { font-weight: 460; color: var(--muted); font-size: 13px; }
.bul { display: grid; gap: 3px; padding-left: 18px; list-style: disc; }
.check { display: flex; gap: 9px; align-items: flex-start; padding: 7px 0; border-top: 1px solid var(--line); }

.check.done span { color: var(--muted); text-decoration: line-through; }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.step { padding: 10px 6px; border: 1px solid var(--line); border-radius: 8px; text-align: center; font-size: 12.5px; color: var(--muted); }
.step:not([disabled]):hover { border-color: var(--fg); }
.step[disabled] { cursor: default; }
.step.past { color: var(--fg); background: var(--sunken); }
.step.now { color: var(--fg); font-weight: 640; border: 2px solid var(--fg); padding: 9px 5px; }
.step small { display: block; font-weight: 390; font-size: 11px; color: var(--muted); }
.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.flow .step.re { border-color: var(--red, #c62828); }
.st-acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.st-note { width: 100%; min-height: 64px; margin-top: 10px; }
.ilog { display: grid; gap: 8px; margin-top: 14px; }
.ilog div { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: 12.5px; color: var(--muted); }
.ilog div b { color: var(--fg); font-weight: 560; }
.ilog p { flex-basis: 100%; margin: 0; color: var(--fg); white-space: pre-wrap; overflow-wrap: anywhere; }
.ifacts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 16px; margin: 12px 0 4px; }
.ifacts div { display: grid; gap: 2px; min-width: 0; }

.ifacts b { font-size: 13.5px; font-weight: 560; overflow-wrap: anywhere; }
.ifacts select { font: inherit; font-size: 13px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--card, transparent); color: inherit; max-width: 100%; }
.done-mark { font-size: 11.5px; color: var(--c-green-fg, var(--muted)); }
@media (max-width: 560px) { .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.msg { display: grid; gap: 2px; padding: 8px 0; border-top: 1px solid var(--line); }
.msg:first-child { border-top: 0; }
.msg .by { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.msg p { white-space: pre-wrap; overflow-wrap: anywhere; }
.compose { display: grid; gap: 7px; justify-items: end; }
.vids { display: grid; gap: 12px; }
.vid { margin: 0; display: grid; gap: 6px; }
.vid video { display: block; width: 100%; max-height: 440px; border-radius: 8px; background: #000; }
.vid figcaption { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; font-size: 12.5px; color: var(--muted); }
.vid figcaption span { min-width: 0; overflow-wrap: anywhere; }
.vid-err { padding: 22px 12px; text-align: center; font-size: 13px; color: var(--muted); background: var(--sunken); border-radius: 8px; }
.vid-up { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.rel { display: grid; gap: 6px; padding: 10px 12px; background: var(--sunken); border-radius: 9px; font-size: 12.5px; }
.rel .rl { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.rel .rl b { font-weight: 540; }

/* 팀 일정 (주간) */
.wk-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.wk-nav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.wk-nav h2 { font-size: 18px; font-weight: 640; padding: 0 6px; }
.filters { display: grid; gap: 8px; padding: 12px 14px; }
.filters .fl { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.filters .fl > span:first-child { font-size: 12px; color: var(--muted); width: 44px; flex: none; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.day { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 320px; display: flex; flex-direction: column; min-width: 0; }
.day-h { display: flex; align-items: baseline; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--sunken); }
.day-h b { font-size: 17px; font-weight: 600; }
.day-h span { font-size: 12px; color: var(--muted); }
.day.today .day-h { background: var(--tint); }
.day.today .day-h b { color: var(--tint-fg); }
.day.weekend .day-h span { color: var(--red-text); }
.day-b { display: grid; gap: 5px; padding: 7px; align-content: start; }
.dl { display: flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 3px 7px; border-radius: 6px; text-align: left; width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.dl.m { background: var(--navy); color: var(--on-navy); font-weight: 540; }
.dl.i { background: var(--cb); color: var(--c); }
.dl.over { background: var(--red-soft); color: var(--red-text); box-shadow: inset 0 0 0 1px var(--red); }
.dl svg.i { width: 12px; height: 12px; }
.ev { display: grid; gap: 3px; padding: 7px 8px; border-radius: 8px; background: var(--cb); color: var(--fg); text-align: left; width: 100%; min-width: 0; }
.ev:hover { box-shadow: inset 0 0 0 1.5px var(--c); }
.ev.und, .mini-ev.und { background: transparent; outline: 1.5px dashed var(--c); outline-offset: -1.5px; }
.avl { display: grid; gap: 6px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.avl-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12.5px; min-width: 0; }
.avl-row .av { width: 22px; height: 22px; font-size: 10px; }
.avl-row b { font-weight: 560; }
.avl-row .sub { font-size: 11.5px; overflow-wrap: anywhere; min-width: 0; }
.ev.sel { box-shadow: inset 0 0 0 2px var(--c); }
.ev .tm { font-size: 11.5px; font-weight: 560; color: var(--c); }
.ev .ti { font-size: 12.5px; font-weight: 540; line-height: 1.35; overflow-wrap: anywhere; }
.ev .ti.masked { color: var(--muted); font-weight: 460; }
.ev .mt { display: flex; align-items: center; justify-content: space-between; gap: 4px; flex-wrap: wrap; }
.ev .ty { font-size: 10.5px; color: var(--c); font-weight: 520; }
.ev.cancelled { background: var(--sunken); opacity: .8; }
.ev.cancelled .ti { text-decoration: line-through; color: var(--muted); }
.ev .avs .av { width: 18px; height: 18px; font-size: 9px; }
.ev .src { font-size: 9.5px; font-weight: 600; letter-spacing: .02em; color: var(--c); box-shadow: inset 0 0 0 1px var(--c); border-radius: 4px; padding: 0 4px; line-height: 1.5; }
.slk { padding: 12px 14px; display: grid; gap: 10px; }
.slk-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; justify-content: space-between; }
.slk-h b { font-size: 14px; font-weight: 600; }
.slk-list { display: grid; gap: 8px; }
.slk-item { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0; background: var(--surface); }
.slk-item .r1 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.slk-item .t { font-size: 13.5px; font-weight: 560; overflow-wrap: anywhere; }
.slk-item .q { font-size: 12.5px; color: var(--muted); border-left: 3px solid var(--line-strong); padding-left: 8px; overflow-wrap: anywhere; white-space: pre-wrap; }

.slk-item .acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.slk-item .cmp { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 2px 8px; font-size: 12.5px; }
.slk-item .cmp dt { color: var(--muted); }
.slk-item a.btn { text-decoration: none; }
.slk-ch { display: grid; gap: 8px; justify-items: start; }
.slk-chlist { display: grid; gap: 8px; width: 100%; }
.day-empty { font-size: 11.5px; color: var(--faint); padding: 4px 2px; }
@media (max-width: 980px) {
.week { grid-template-columns: minmax(0, 1fr); }
.day { min-height: 0; }
.day-h { padding: 8px 12px; }
.day-b { grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
}

/* 오른쪽 상세 패널 */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -18px 0 50px rgba(10, 20, 60, .16); z-index: 50; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.drawer-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px max(18px, env(safe-area-inset-right, 0px)) 10px 18px; border-bottom: 1px solid var(--line); }
.drawer-b { padding: 16px max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 18px; overflow-y: auto; display: grid; gap: 16px; align-content: start; }
.kv { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px 12px; font-size: 13px; align-items: start; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.plist { display: flex; flex-wrap: wrap; gap: 6px 12px; }
.plist span { display: inline-flex; align-items: center; gap: 6px; }

/* 대화상자·검토 카드 */
dialog { border: 0; border-radius: 14px; padding: 0; background: var(--surface); color: var(--fg); width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 18px 50px rgba(15, 20, 40, .28); }
dialog::backdrop { background: rgba(15, 20, 40, .45); }
dialog.wide { width: min(1120px, calc(100vw - 32px)); }
.form { padding: 20px; display: grid; gap: 13px; }
.form h2 { font-size: 18px; font-weight: 640; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > label, .field > .lb { font-size: 12.5px; font-weight: 560; }
.field small { font-size: 12px; color: var(--muted); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
textarea, input[type="text"], input[type="search"], input[type="date"], input[type="time"], input[type="password"], select { width: 100%; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); min-width: 0; }
textarea { resize: vertical; min-height: 66px; }
.picker { max-height: 196px; overflow-y: auto; border: 1px solid var(--line); border-radius: 7px; }
.pick { display: flex; align-items: flex-start; gap: 9px; padding: 7px 10px; border-top: 1px solid var(--line); cursor: pointer; }
.pick:first-child { border-top: 0; }
.pick input { margin-top: 3px; accent-color: var(--primary); flex: none; }
.pick span { min-width: 0; overflow-wrap: anywhere; }
.pick small { display: block; }
.form-foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; align-items: center; }
.add-wrap { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; max-height: calc(100vh - 48px); }
.add-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs { display: inline-flex; padding: 3px; background: var(--sunken); border-radius: 9px; }
.tabs button { padding: 6px 14px; border-radius: 7px; font-size: 13px; color: var(--muted); font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(10, 20, 60, .12); }
.add-body { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); min-height: 0; overflow: hidden; }
.add-body.single { grid-template-columns: minmax(0, 1fr); }
.add-in { padding: 16px 20px; display: grid; gap: 10px; align-content: start; border-right: 1px solid var(--line); overflow-y: auto; }
.add-in textarea { min-height: 220px; font-size: 14px; line-height: 1.7; }
.guide { font-size: 12px; color: var(--muted); background: var(--sunken); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; }
.guide code { font-family: inherit; color: var(--fg); background: var(--surface); padding: 0 5px; border-radius: 4px; }
.add-out { padding: 16px 20px; overflow-y: auto; display: grid; gap: 10px; align-content: start; }
.add-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 20px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); flex-wrap: wrap; }
@media (max-width: 820px) { .add-body { grid-template-columns: minmax(0, 1fr); overflow-y: auto; } .add-in { border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; } .add-out { overflow: visible; } }
.rcard { border: 1px solid var(--line); border-radius: 11px; padding: 12px; display: grid; gap: 10px; background: var(--surface); }
.rcard.needs { border-color: var(--red); box-shadow: inset 3px 0 0 var(--red); }

};
const icon = (n, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

/* ---------- 상태 ---------- */
const S = {
me: null, members: [], issues: [], milestones: [], comments: [], events: [], notifs: [],
load: 'loading', route: 'dashboard', from: 'dashboard',
month: null, kind: 'all', project: 'all', openOnly: false, sel: { type: 'home' }, confirm: null,
taskProject: 'all', taskOpen: false, taskSt: 'all', stNote: '',
week: null, sf: { types: new Set(), people: new Set(), cancelled: false, deadlines: true },
sv: 'team', calMode: 'week', calMonth: null, avDay: null, avPeople: new Set(), ft: { people: new Set(), from: '', to: '', dur: 60 },
drawer: null, statusEdit: false, nfilter: 'all', q: '', pop: null, uploading: null,
add: null,
slack: [], slackSet: null, slackCh: [], slf: 'review', slOpen: null,
realEvents: [], series: [], patterns: [], plans: [], tasks: [], prefs: null, cwEdit: false,
};

/* ---------- 도우미 ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const KST = 9 * 3600e3;
const today = () => new Date(Date.now() + KST).toISOString().slice(0, 10);
const kst = iso => { const s = new Date(new Date(iso).getTime() + KST).toISOString(); return { date: s.slice(0, 10), time: s.slice(11, 16) }; };
const toIso = (d, t) => `${d}T${t || '00:00'}:00+09:00`;
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dowOf = s => new Date(s + 'T00:00:00Z').getUTCDay();
const weekStart = s => addDays(s, -((dowOf(s) + 6) % 7));
const diff = s => Math.round((Date.parse(s + 'T00:00:00Z') - Date.parse(today() + 'T00:00:00Z')) / 864e5);
const dlabel = s => { const d = diff(s); return d === 0 ? 'D-Day' : d > 0 ? `D-${d}` : `D+${-d}`; };
const md = s => `${+s.slice(5, 7)}.${+s.slice(8, 10)}`;
const full = s => `${s.slice(0, 4)}.${s.slice(5, 7)}.${s.slice(8, 10)} (${DOW[dowOf(s)]})`;
const stamp = iso => { if (!iso) return ''; const k = kst(iso); return `${k.date.replace(/-/g, '.')} ${k.time}`; };
const ago = iso => { const m = Math.round((Date.now() - new Date(iso)) / 6e4); if (m < 1) return '방금'; if (m < 60) return `${m}분 전`; const h = Math.round(m / 60); if (h < 24) return `${h}시간 전`; const d = Math.round(h / 24); return d < 7 ? `${d}일 전` : stamp(iso).slice(0, 10); };
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const isAdmin = () => S.me && S.me.role === 'admin';

/* ---------- 팀원 ---------- */
const member = id => S.members.find(m => m.id === id);
const nameOf = id => member(id)?.name || (typeof id === 'string' && id.length < 30 ? id : '팀원');
const hue = s => AV_C[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % AV_C.length];
function avatar(id, extra = '') {
const m = member(id), n = nameOf(id);
if (m && m.avatar) return `<span class="av ${extra}" title="${esc(n)}"><img src="${esc(m.avatar)}" alt=""></span>`;
return `<span class="av c-${hue(n)} ${extra}" title="${esc(n)}">${esc(n.slice(0, 1))}</span>`;
}
const team = () => S.members.filter(m => !m.hidden || m.id === S.me?.id).sort((a, b) => a.sort - b.sort || a.name.localeCompare(b.name));

/* ---------- 이슈·마감 판정 ---------- */
const istOf = i => IST[i.status] ? i.status : (i.step || 0) >= 3 ? 'resolved' : i.step === 2 ? 'review' : (i.step === 1 || takers(i).length) ? 'progress' : 'open';
const closed = i => istOf(i) === 'resolved';
const prioOf = i => PRIO[i.priority] ? i.priority : 'normal';
const prioTag = i => { const p = PRIO[prioOf(i)]; return p[1] && p[0] !== '보통' ? `<span class="tag c-${p[1]}">${p[0]}</span>` : ''; };
const canStatus = i => !!S.me && (isAdmin() || isMine(i) || i.creator === S.me.id);
const iUpdated = i => i.updatedAt || i._upd || null;
const takers = i => [...(i.takers || []), ...(i.exampleTakers || [])];
const free = i => !closed(i) && takers(i).length === 0;
const isMine = i => !!S.me && (i.takers || []).includes(S.me.id);
const over = i => !closed(i) && diff(i.due) < 0;
const hot = i => !closed(i) && (diff(i.due) <= 0 || (free(i) && diff(i.due) <= 3));
const canAct = i => isMine(i) || isAdmin();
const istatus = i => IST[istOf(i)];
const inProject = (p, sel) => sel === 'all' || p === sel || p === 'BeCalm';
const linked = m => (m.issueIds || []).map(id => S.issues.find(i => i.id === id)).filter(Boolean).sort((a, b) => a.due.localeCompare(b.due));
const prog = m => { const l = linked(m), c = l.filter(closed).length; return { n: l.length, c, pct: l.length ? Math.round(c / l.length * 100) : 0, done: l.length > 0 && c === l.length }; };
const milestonesOf = i => S.milestones.filter(m => (m.issueIds || []).includes(i.id));
const creatorName = x => x.creator ? nameOf(x.creator) : (x.exampleCreator || '팀원');
const canManage = x => isAdmin() || (!!S.me && x.creator === S.me.id);

/* ---------- 팀 일정 판정 ---------- */
const evKind = e => (e.kind && ECAT[e.kind]) ? e.kind : (ECAT[e.category] ? e.category : 'other');
const kindLabel = e => ECAT[evKind(e)][0];
const timeOnly = e => e.visibility !== 'team' && e.share === 'time';
const evLabel = e => e.title != null ? e.title : (timeOnly(e) ? '부재' : (e.public_title || kindLabel(e)));
const evColor = e => ECAT[evKind(e)][1];
const scopeOf = e => e.visibility === 'team' ? 'detail' : e.visibility === 'limited' ? 'limited' : (e.share || 'type');
const scopeVis = sc => sc === 'detail' ? { visibility: 'team', share: 'type' } : sc === 'limited' ? { visibility: 'limited', share: 'type' } : { visibility: 'private', share: sc };
const defaultScope = k => ['personal', 'class', 'vacation', 'absence'].includes(k) ? 'type' : 'detail';
// 다른 팀원에게 보이는 이름 (내 일정에서 미리 보기용)
const pubText = e => e.visibility === 'team' ? evLabel(e) : e.share === 'self' ? '보이지 않음' : e.share === 'time' ? '부재' : (e.public_title || kindLabel(e));
const isOpenEnd = e => e.time_mode === 'start_only';
const isPart = e => e.time_mode === 'part_of_day';
const needsCheck = e => e.confirm === 'needs_check';
const evMine = e => !!S.me && (e.created_by === S.me.id || e.participants.includes(S.me.id));
const isTeamEv = e => TEAM_KINDS.includes(evKind(e)) && e.visibility !== 'private';
const partLabel = e => e.day_part === 'am' ? '오전' : '오후';
const evEnd = e => { const en = kst(e.end_at); return e.all_day ? addDays(en.date, -1) : (en.time === '00:00' ? addDays(en.date, -1) : en.date); };
function evDays(e) { const s = kst(e.start_at).date, end = evEnd(e), out = []; for (let d = s; d <= end && out.length < 60; d = addDays(d, 1)) out.push(d); return out; }
const isUnd = e => e.time_mode === 'undecided';
const tmRank = e => e.all_day ? 0 : isUnd(e) ? 1 : isPart(e) ? 2 : 3;
function evTime(e, day) {
if (isUnd(e)) return '시간 미정';
if (e.all_day) return '종일';
if (isPart(e)) return `${partLabel(e)} · 세부 시간 미정`;
const s = kst(e.start_at), en = kst(e.end_at), end = evEnd(e);
if (isOpenEnd(e)) return `${s.time}~ ${e.est_end_at ? `예상 ${kst(e.est_end_at).time}` : '종료 미정'}`;
if (s.date === end) return `${s.time}–${en.time}`;
if (day === s.date) return `${s.time}~`;
if (day === end) return `~${en.time}`;
return '종일';
}
function evRange(e) {
const s = kst(e.start_at), end = evEnd(e);
if (isUnd(e)) return `${full(s.date)} · 시간 미정`;
if (isPart(e)) return `${full(s.date)} · ${partLabel(e)} (세부 시간 미정)`;
if (isOpenEnd(e)) return `${full(s.date)} · ${s.time} 시작 · ${e.est_end_at ? `예상 종료 ${kst(e.est_end_at).time} (확정 아님)` : '종료 시간 미정'}`;
if (e.all_day) return s.date === end ? `${full(s.date)} · 종일` : `${full(s.date)} ~ ${full(end)} · 종일`;
const en = kst(e.end_at);
return s.date === end ? `${full(s.date)} · ${s.time}–${en.time}` : `${full(s.date)} ${s.time} ~ ${full(end)} ${en.time}`;
}
function evSpan(e, day) {
if (e.all_day) return { a: 0, b: 1440, t: 'all' };
if (isUnd(e)) return { a: null, b: null, t: 'und' };
const s = kst(e.start_at), a = s.date < day ? 0 : hm(s.time);
if (isOpenEnd(e)) {
if (e.est_end_at) { const x = kst(e.est_end_at); return { a, b: x.date > day ? 1440 : hm(x.time), t: 'est' }; }
return { a, b: 1440, t: 'open' };
}
const en = kst(e.end_at);
return { a, b: en.date > day ? 1440 : hm(en.time), t: isPart(e) ? 'part' : 'busy' };
}
const canEditEv = e => !!S.me && (e.created_by === S.me.id || (isAdmin() && e.visibility === 'team'));
const evOn = (day, opts = {}) => S.events.filter(e => (opts.cancelled || e.status === 'active') && evDays(e).includes(day))
.sort((a, b) => (tmRank(a) - tmRank(b)) || a.start_at.localeCompare(b.start_at));

/* ---------- 공통 조각 ---------- */
const avs = ids => `<span class="avs">${ids.map(id => avatar(id)).join('')}</span>`;
function takerAvs(i) {
const a = (i.takers || []).map(id => avatar(id));
const b = (i.exampleTakers || []).map(n => avatar(n));
return `<span class="avs">${a.concat(b).join('')}</span>`;
}
const dueTag = i => closed(i) ? `<span class="due">${md(i.due)}</span>` : `<span class="due${hot(i) ? ' hot' : ''}">${free(i) ? '미배정 · ' : ''}${md(i.due)} · <b>${dlabel(i.due)}</b></span>`;
const ipill = i => { const [t, c] = istatus(i); return `<span class="tag ${c ? 'c-' + c : 'line'}">${esc(t)}</span>`; };
const exTag = x => x.example ? '<span class="tag ex">예시</span>' : '';
const projTag = p => `<span class="tag c-${PROJ_C[p] || 'slate'}">${esc(p)}</span>`;
const catTag = c => `<span class="tag c-${CAT_C[c] || 'slate'}">${esc(c)}</span>`;
const evTag = e => `<span class="tag c-${evColor(e)}">${kindLabel(e)}</span>`;
const issueRow = i => `<button class="row" data-act="issue" data-id="${esc(i.id)}">
<span class="r1"><span class="code">${esc(i.code)}</span>${prioTag(i)}${projTag(i.project)}${exTag(i)}</span>
<span class="t">${esc(i.title)}</span>
<span class="r2"><span class="r1">${ipill(i)}${takerAvs(i)}</span>${dueTag(i)}</span></button>`;
function msRow(m) {
const p = prog(m), late = !p.done && diff(m.date) < 0;
const dd = p.done ? '<span class="due">완료</span>' : `<span class="due${diff(m.date) <= 0 ? ' hot' : ''}">${md(m.date)} · <b>${dlabel(m.date)}</b></span>`;
return `<button class="row" data-act="milestone" data-id="${esc(m.id)}">
<span class="r1">${projTag(m.project)}${exTag(m)}${late ? '<span class="tag c-red">기한 초과</span>' : ''}</span>
<span class="t">${esc(m.title)}</span>
<span class="bar"><i style="width:${p.pct}%"></i></span>
<span class="r2"><span class="pct">${p.c} / ${p.n} 닫힘</span>${dd}</span></button>`;
}
function miniEv(e, showDate) {
const s = kst(e.start_at);
return `<button class="mini-ev c-${evColor(e)}${isUnd(e) ? ' und' : ''}" data-act="event" data-id="${e.id}">
<span class="when">${showDate ? md(s.date) + ' ' : ''}${evTime(e, s.date)}</span><span class="what">${esc(evLabel(e))}</span>
<span class="who">${avs(e.participants)}<span>${esc(e.participants.map(nameOf).join(', '))} · ${kindLabel(e)}</span></span></button>`;
}
const emptyBox = (t, s, extra = '') => `<div class="empty"><strong>${esc(t)}</strong><span>${esc(s)}</span>${extra}</div>`;
function relatedHTML(date) {
if (!date) return '<div class="rel"><span class="sub">날짜를 고르면 그날 팀 일정을 함께 보여 드려요.</span></div>';
const evs = evOn(date);
const lines = evs.map(e => `<div class="rl">${avs(e.participants)}<b>${esc(e.participants.map(nameOf).join(', '))}</b><span>${evTime(e, date)}</span><span class="tag c-${evColor(e)}">${kindLabel(e)}</span><span>${esc(evLabel(e))}</span></div>`).join('');
return `<div class="rel"><div class="sec"><span>${md(date)} 팀 일정 ${evs.length}건</span><button type="button" class="btn link" data-act="rel-week" data-id="${date}">주간 일정에서 보기</button></div>
${lines || '<span class="sub">이 날짜에 등록된 팀 일정이 없어요. 일정이 없다고 모두 가능하다는 뜻은 아니에요.</span>'}
${evs.length ? '<span class="sub">참고용 정보예요. 마감 저장을 막지 않아요.</span>' : ''}</div>`;
}

/* ---------- 대시보드 ---------- */
function summary() {
const iss = S.issues.filter(i => inProject(i.project, S.project));
const ms = S.milestones.filter(m => inProject(m.project, S.project) && !prog(m).done && diff(m.date) >= 0).sort((a, b) => a.date.localeCompare(b.date));
const n = ms[0], t0 = weekStart(today()), t1 = addDays(t0, 6);
const week = iss.filter(i => !closed(i) && i.due >= t0 && i.due <= t1);
const fr = iss.filter(free), soon = fr.filter(i => diff(i.due) <= 3), late = iss.filter(over);
let hero;
if (n) {
const p = prog(n);
hero = `<button class="hero" data-act="milestone" data-id="${esc(n.id)}"><span class="eyebrow">다음 주요 마감</span>
<span class="line"><span class="ti">${esc(n.title)}</span><span class="dd">${dlabel(n.date)}</span></span>
<span class="bar"><i style="width:${p.pct}%"></i></span>
<span class="meta"><span>${esc(n.project)} · ${full(n.date)}</span><span>연결 이슈 ${p.n}개 중 ${p.c}개 닫힘</span></span></button>`;
} else hero = `<div class="hero"><span class="eyebrow">다음 주요 마감</span><span class="ti">${S.load === 'loading' ? '불러오는 중이에요' : '예정된 주요 마감이 없어요'}</span><span class="meta"><span>주요 마감을 등록하면 D-Day와 진행률이 여기에 보여요.</span></span></div>`;
const pressed = k => S.sel.type === 'list' && S.sel.id === k;
const stat = (k, label, v, sub, h) => `<button class="stat" data-act="list" data-id="${k}" aria-pressed="${pressed(k)}"><span class="k">${label}</span><span class="v${h && v ? ' hot' : ''}">${v}</span><span class="s">${esc(sub)}</span></button>`;
return `<section class="summary" aria-label="요약">${hero}
${stat('week', '이번 주 마감', week.length, `미배정 ${week.filter(free).length}개`)}
${stat('free', '미배정 이슈', fr.length, `3일 안에 마감 ${soon.length}개`, soon.length > 0)}
${stat('late', '기한 초과', late.length, '아직 닫히지 않은 이슈', true)}</section>`;
}
function calendar() {
const [y, mo] = S.month.split('-').map(Number);
const first = `${S.month}-01`, start = addDays(first, -dowOf(first));
const days = new Date(Date.UTC(y, mo, 0)).getUTCDate();
const cells = Math.ceil((dowOf(first) + days) / 7) * 7, t = today();
const seld = S.sel.type === 'date' ? S.sel.id : null, selm = S.sel.type === 'milestone' ? S.sel.id : null;
let html = DOW.map(d => `<div class="dow">${d}</div>`).join('');
for (let k = 0; k < cells; k++) {
const key = addDays(start, k);
const ms = S.kind === 'issue' ? [] : S.milestones.filter(x => x.date === key && inProject(x.project, S.project));
const iss = S.kind === 'milestone' ? [] : S.issues.filter(i => i.due === key && inProject(i.project, S.project) && !(S.openOnly && closed(i)));
const chips = [
...ms.map(x => `<button class="chip m${x.id === selm ? ' sel' : ''}" data-act="milestone" data-id="${esc(x.id)}" title="주요 마감: ${esc(x.title)}">${esc(x.title)}</button>`),
...iss.map(i => `<button class="chip c-${PROJ_C[i.project] || 'slate'}${over(i) ? ' over' : closed(i) ? ' closed' : ''}" data-act="issue" data-id="${esc(i.id)}" title="${esc(i.code)} ${esc(i.project)}: ${esc(i.title)}"><b>${PROJ_S[i.project] || ''}</b>${esc(i.title)}</button>`),
];
const nev = evOn(key).length;
const extra = chips.length - 3;
html += `<div class="cell${key.slice(0, 7) !== S.month ? ' out' : ''}${key === t ? ' today' : ''}${key === seld ? ' sel' : ''}" data-act="date" data-id="${key}">
<button class="num" aria-label="${+key.slice(5, 7)}월 ${+key.slice(8)}일, 마감 ${chips.length}개, 팀 일정 ${nev}개">${+key.slice(8)}</button>
${chips.slice(0, 3).join('')}${extra > 0 ? `<button class="more" data-act="date" data-id="${key}">+${extra}개 더보기</button>` : ''}
${nev ? `<span class="more" style="pointer-events:none">팀 일정 ${nev}</span>` : ''}</div>`;
}
const chip = (act, val, cur, label, c = '') => `<button class="fchip ${c}" data-act="${act}" data-id="${val}" aria-pressed="${cur === val}">${label}</button>`;
return `<section class="sheet cal" aria-label="마감 캘린더">
<div class="cal-head">
<div class="month"><button class="round" data-act="prev" aria-label="이전 달">${icon('left')}</button><h2>${y}년 ${mo}월</h2><button class="round" data-act="next" aria-label="다음 달">${icon('right')}</button><button class="btn small" data-act="thismonth">오늘</button></div>
<div class="chips">${chip('kind', 'all', S.kind, '전체 마감')}${chip('kind', 'milestone', S.kind, '주요 마감')}${chip('kind', 'issue', S.kind, '이슈 마감')}</div>
</div>
<div class="cal-head">
<div class="chips">${chip('proj', 'all', S.project, '전체 프로젝트')}${PROJECTS.map(p => chip('proj', p, S.project, p, 'c-' + PROJ_C[p])).join('')}<button class="fchip" data-act="openonly" aria-pressed="${S.openOnly}">해결된 이슈 숨기기</button></div>
<div class="legend"><span><i class="m"></i>주요 마감</span><span class="c-sky"><i></i>iOS 이슈</span><span class="c-lime"><i></i>AOS 이슈</span><span><i class="o"></i>기한 초과</span></div>
</div>
<div class="grid">${html}</div></section>`;
}
function panel() {
const s = S.sel;
if (s.type === 'date') {
const ms = S.milestones.filter(x => x.date === s.id && inProject(x.project, S.project));
const iss = S.issues.filter(i => i.due === s.id && inProject(i.project, S.project));
const evs = evOn(s.id);
return `<div class="p-head"><div><h2>${+s.id.slice(5, 7)}월 ${+s.id.slice(8)}일 ${DOW[dowOf(s.id)]}요일</h2><p class="sub">마감 ${ms.length + iss.length}건 · 팀 일정 ${evs.length}건</p></div><button class="btn small" data-act="home">닫기</button></div>
${ms.length ? `<div class="stack"><div class="sec">주요 마감</div>${ms.map(msRow).join('')}</div>` : ''}

}
if (s.type === 'milestone') {
const m = S.milestones.find(x => x.id === s.id);
if (m) {

async function carryOver(id = S.me.id, day = today()) {

}

function issueView(id) {

const back = `<button class="back" data-act="back">← ${backLabel}</button>`;
if (!i) return `<div class="doc">${back}<div class="sheet">${emptyBox(S.load === 'loading' ? '이슈를 불러오는 중이에요' : '이슈를 찾을 수 없어요', S.load === 'loading' ? '잠시만 기다려 주세요.' : '삭제되었거나 링크가 잘못되었어요.')}</div></div>`;

const msg = c => `<div class="msg"><span class="by">${avatar(c.by)}${esc(nameOf(c.by))} · ${esc(stamp(c.at))}</span><p>${esc(c.text)}</p></div>`;
const memos = cs.filter(c => c.kind === 'memo'), chats = cs.filter(c => c.kind === 'chat'), ms = milestonesOf(i);
const take = closed(i) ? '' : isMine(i) ? `<button class="btn small" data-act="untake">맡기 취소</button>` : `<button class="plus" data-act="take"><i aria-hidden="true">+</i>내가 맡기</button>`;
const del = canManage(i) ? (S.confirm === i.id
? `<div class="actions"><span class="sub">이 이슈를 삭제할까요? 대화와 메모도 함께 보이지 않게 돼요.</span><button class="btn small danger" data-act="iss-del-yes">삭제</button><button class="btn small" data-act="confirm-no">취소</button></div>`
: `<div class="actions"><button class="btn small" data-act="iss-del">이슈 삭제</button></div>`) : '';
return `<div class="doc">${back}
<div class="doc-head"><div class="actions"><span class="code">${esc(i.code)}</span>${ipill(i)}${catTag(i.category)}${projTag(i.project)}${exTag(i)}</div>
<h1>${esc(i.title)}</h1>
<div class="sub">등록 ${esc((i.createdAt || '').replace(/-/g, '.'))} · 등록자 ${esc(creatorName(i))} · 마감 ${dueTag(i)}</div>
${issueFacts(i)}
<div class="takers">${takerAvs(i)}${take}${free(i) ? '<span class="sub">아직 아무도 맡지 않았어요.</span>' : ''}</div></div>
${ms.length ? `<section class="sheet block"><h2>이 이슈가 속한 주요 마감</h2><div class="stack">${ms.map(msRow).join('')}</div></section>` : ''}

${videoSection(i)}
<section class="sheet block"><h2>이렇게 되면 끝나요 <span>${done} / ${crit.length}</span></h2><div>${crit.map((c, k) => `<label class="check${c.done ? ' done' : ''}"><input type="checkbox" id="crit-${k}" data-act="crit" data-id="${k}" ${c.done ? 'checked' : ''} ${act ? '' : 'disabled'}><span>${esc(c.text)}</span></label>`).join('') || '<p class="sub">완료 조건이 없어요.</p>'}</div></section>
${statusSection(i)}
<section class="sheet block"><h2>마감일의 팀 일정</h2>${relatedHTML(i.due)}</section>

${act ? `<div class="compose"><textarea id="memo-text" aria-label="수정 메모" placeholder="수정 메모 작성"></textarea><button class="btn small" data-act="send" data-id="memo">메모 남기기</button></div>` : ''}</section>
<section class="sheet block"><h2>대화</h2><div>${chats.map(msg).join('') || '<p class="sub">아직 대화가 없어요.</p>'}</div>
<div class="compose"><textarea id="chat-text" aria-label="메시지" placeholder="메시지 입력 · Ctrl+Enter로 보내기"></textarea><button class="btn small primary" data-act="send" data-id="chat">보내기</button></div></section>

// 이슈 핵심 정보: 담당자·생성자·우선순위·마감·상태·업데이트·해결
function issueFacts(i) {
const mng = canManage(i) || canStatus(i);
const prio = mng ? `<select data-ifield="priority" aria-label="우선순위">${Object.entries(PRIO).map(([k, v]) => `<option value="${k}" ${prioOf(i) === k ? 'selected' : ''}>${v[0]}</option>`).join('')}</select>` : `<b>${PRIO[prioOf(i)][0]}</b>`;
const qa = mng ? `<select data-ifield="qa" aria-label="검증 필요 여부"><option value="0" ${i.qa ? '' : 'selected'}>필요 없음</option><option value="1" ${i.qa ? 'selected' : ''}>확인 대기 거쳐야 함</option></select>` : `<b>${i.qa ? '확인 대기 거쳐야 함' : '필요 없음'}</b>`;

<div><span>담당자</span><b>${who}</b>${assign}</div>
<div><span>생성자</span><b>${esc(creatorName(i))}</b></div>
<div><span>우선순위</span>${prio}</div>
<div><span>마감일</span><b>${esc(full(i.due))}</b></div>
<div><span>현재 상태</span><b>${IST[istOf(i)][0]}</b></div>
<div><span>마지막 업데이트</span><b>${upd ? esc(stamp(upd)) : '-'}</b></div>
<div><span>해결 여부</span><b>${closed(i) ? `해결됨${i.resolvedAt ? ' · ' + esc(stamp(i.resolvedAt)) : ''}${i.resolvedBy ? ' · ' + esc(nameOf(i.resolvedBy)) : ''}` : '아직 해결 안 됨'}</b></div>
<div><span>검증(QA)</span>${qa}</div></div>`;
}
const IST_VERB = { progress: '진행 시작', review: '확인 요청', resolved: '해결 완료', reopened: '재오픈', open: '등록됨으로 되돌리기' };
function statusSection(i) {
const st = istOf(i), can = canStatus(i) || (st === 'open' && free(i));
const pos = st === 'reopened' ? 1 : IST_ORDER.indexOf(st);
const flow = IST_ORDER.map((k, n) => `<span class="step${n < pos ? ' past' : ''}${k === st || (st === 'reopened' && n === 1) ? ' now' : ''}${st === 'reopened' && n === 1 ? ' re' : ''}">${n < pos ? '✓ ' : ''}${st === 'reopened' && n === 1 ? '재오픈' : IST[k][0]}${k === st || (st === 'reopened' && n === 1) ? '<small>현재</small>' : ''}</span>`).join('');
const next = { open: ['progress', 'review', 'resolved'], progress: ['review', 'resolved'], reopened: ['review', 'resolved'], review: ['resolved', 'progress'], resolved: ['reopened'] }[st]
.filter(k => !(k === 'resolved' && i.qa && st !== 'review')).filter(k => canStatus(i) || k === 'progress');
const label = k => k === 'progress' && st === 'review' ? '다시 진행 중으로' : k === 'progress' && !canStatus(i) ? '내가 맡아서 진행' : IST_VERB[k];
const hint = st === 'review' ? '확인한 결과를 적고 해결 완료로 바꿔 주세요. 문제가 남았으면 다시 진행 중으로 돌려요.'
: st === 'resolved' ? '같은 문제가 다시 생기면 이유를 적고 재오픈하세요.'
: i.qa ? '이 이슈는 검증이 필요해서 ‘확인 대기’를 거쳐야 해결 완료할 수 있어요.' : '검증이 필요 없으면 바로 해결 완료할 수 있어요.';
const acts = can ? `<textarea class="st-note" id="st-note" placeholder="${st === 'resolved' ? '재오픈 이유 (필수)' : '해결 내용이나 확인 결과 (선택)'}" aria-label="상태 변경 메모"></textarea>
<div class="st-acts">${next.map(k => `<button class="btn small${k === 'resolved' ? ' primary' : k === 'reopened' ? ' danger' : ''}" data-act="ist" data-id="${k}">${label(k)}</button>`).join('')}<span class="sub">${esc(hint)}</span></div>`
: '<p class="sub">담당자, 등록자, 관리자가 상태를 바꿀 수 있어요. 이슈를 맡으면 진행할 수 있어요.</p>';
const log = (i.log || []).slice().reverse().map(l => `<div><b>${esc(nameOf(l.by))}</b><span>${IST[l.from]?.[0] || ''} → ${IST[l.to]?.[0] || ''}</span><span>${esc(stamp(l.at))}</span>${l.note ? `<p>${esc(l.note)}</p>` : ''}</div>`).join('');
return `<section class="sheet block"><h2>진행 상태</h2><div class="flow">${flow}</div>
${closed(i) && i.resolution ? `<p class="sub" style="margin-top:10px">해결 기록: ${esc(i.resolution)}</p>` : ''}
${acts}${log ? `<div class="ilog"><div class="sec">상태 기록</div>${log}</div>` : ''}</section>`;
}

const dlIssue = i => `<button class="dl i c-${PROJ_C[i.project] || 'slate'}${over(i) ? ' over' : ''}" data-act="issue" data-id="${esc(i.id)}" title="이슈 마감: ${esc(i.title)}">${icon('flag')}${esc(PROJ_S[i.project] || '')} ${esc(i.title)}</button>`;

function weekGrid(pass, dls, opts = {}) {

return { html: `<div class="week">${cols}</div>`, total };

function weekNav() {

const teamDl = d => !S.sf.deadlines ? [] : [...S.milestones.filter(m => m.date === d).map(dlMs), ...S.issues.filter(i => i.due === d && !closed(i)).map(dlIssue)];

// ① Team Calendar: 팀 회의·비즈니스·외근 같은 업무 일정과 마감. 개인 약속·수업은 넣지 않는다. 확인 필요 일정은 따로 보여 준다.

// ② Team Availability: 가로 타임라인
const AV_A = 7 * 60, AV_B = 24 * 60;
const avPct = x => ((Math.max(AV_A, Math.min(AV_B, x)) - AV_A) / (AV_B - AV_A) * 100).toFixed(2);
function avPeople() { const all = team(); return S.avPeople && S.avPeople.size ? all.filter(m => S.avPeople.has(m.id)) : all; }
function avRow(m, day, nowMin) {
const evs = evOn(day).filter(e => e.participants.includes(m.id));
const w = dayWork(m.id, day), tags = [], blocks = [];
for (const e of evs) {
const sp = evSpan(e, day), lab = evLabel(e);
if (sp.t === 'all' || sp.t === 'und') { tags.push(`<button class="avtag c-${evColor(e)}${sp.t === 'und' ? ' und' : ''}" data-act="event" data-id="${e.id}">${sp.t === 'all' ? '종일' : '시간 미정'} · ${esc(lab)}</button>`); continue; }
const a = Math.max(sp.a, AV_A), b = sp.t === 'open' ? Math.min(sp.a + 90, AV_B) : Math.min(sp.b, AV_B);
if (b <= AV_A || a >= AV_B) continue;
const tip = `${evTime(e, day)} ${lab}${needsCheck(e) ? ' · 확인 필요' : ''}${sp.t === 'open' ? ' · 종료 시간 미정' : sp.t === 'est' ? ' · 종료는 예상' : sp.t === 'part' ? ' · 세부 시간 미정' : ''}`;
blocks.push(`<button class="avb c-${evColor(e)} t-${sp.t}${needsCheck(e) ? ' chk' : ''}" style="left:${avPct(a)}%;width:${(avPct(b) - avPct(a)).toFixed(2)}%" data-act="event" data-id="${e.id}" title="${esc(tip)}"><b>${esc(lab)}</b><span>${esc(evTime(e, day))}</span></button>`);
}
const band = w.start ? `<i class="av-work" style="left:${avPct(hm(w.start))}%;width:${(avPct(hm(w.end)) - avPct(hm(w.start))).toFixed(2)}%" title="근무 가능 확인: ${w.start}–${w.end}"></i>` : '';
const note = w.start ? `근무 ${w.start}–${w.end}` : w.off ? w.why : '근무시간 미등록';
const now = nowMin != null && nowMin >= AV_A && nowMin <= AV_B ? `<i class="av-now" style="left:${avPct(nowMin)}%"></i>` : '';
return `<div class="av-row"><div class="av-who">${avatar(m.id)}<span><b>${esc(m.name)}</b><small class="${w.start ? '' : 'warn'}">${esc(note)}</small></span></div>
<div class="av-track${w.start ? ' has-work' : w.off ? ' off' : ' no-work'}">${band}${blocks.join('')}${now}${tags.length ? `<div class="av-tags">${tags.join('')}</div>` : ''}</div></div>`;
}
function availView() {
const day = S.avDay || today(), t = today(), nowMin = day === t ? nowMinKst() : null;
const hours = []; for (let h = 8; h < 24; h += 2) hours.push(`<span style="left:${avPct(h * 60)}%">${h}</span>`);
const sel = S.avPeople || new Set();

// Find a Time: AI 없이 시간 구간 비교. 근무 정보가 없는 팀원이 있으면 확정 추천하지 않는다.
const FT_A = 8 * 60, FT_B = 22 * 60, FT_STEP = 30, FT_OPEN = 180; // 종료 미정 일정은 시작 후 3시간까지 '판단 불가'로 본다
const FT_ST = { ok: ['근무 가능 확인된 공통 시간', 'green'], free: ['일정 충돌 없음 · 근무 여부 미확인', 'blue'], unknown: ['정보 부족 · 판단 불가', 'amber'], conflict: ['일정과 충돌', 'red'] };
function personSlot(id, day, a, b) {
const w = dayWork(id, day);
if (w.off) return ['conflict', w.why];
let unknown = null;
for (const e of evOn(day).filter(x => x.participants.includes(id))) {
const sp = evSpan(e, day), lab = evLabel(e);
if (sp.t === 'und') { unknown = unknown || `${lab} 시간 미정`; continue; }
const end = sp.t === 'open' ? Math.min(1440, sp.a + FT_OPEN) : sp.b;
if (!(sp.a < b && a < end)) continue;
if (needsCheck(e) || sp.t === 'part' || sp.t === 'open') { unknown = unknown || `${evTime(e, day)} ${lab}${needsCheck(e) ? ' (확인 필요)' : ''}`; continue; }
return ['conflict', `${evTime(e, day)} ${lab}`];
}
if (unknown) return ['unknown', unknown];
if (w.start) return a >= hm(w.start) && b <= hm(w.end) ? ['ok', ''] : ['conflict', `근무시간 ${w.start}–${w.end} 밖`];
return ['free', '근무시간 미등록'];
}
function findSlots(people, from, to, dur) {
const days = [], nowMs = Date.now();
for (let d = from; d <= to && days.length < 14; d = addDays(d, 1)) {
const cells = [];
for (let a = FT_A; a + dur <= FT_B; a += FT_STEP) {
const startMs = new Date(toIso(d, `${pad(Math.floor(a / 60))}:${pad(a % 60)}`)).getTime();
if (startMs < nowMs) { cells.push({ a, st: 'past' }); continue; }
const per = people.map(id => [id, ...personSlot(id, d, a, a + dur)]);
const st = per.some(x => x[1] === 'conflict') ? 'conflict' : per.some(x => x[1] === 'unknown') ? 'unknown' : per.every(x => x[1] === 'ok') ? 'ok' : 'free';
cells.push({ a, st, why: per.filter(x => x[2]).map(x => `${nameOf(x[0])}: ${x[2]}`).join(' · ') });
}
days.push({ d, cells });
}
return days;
}
const hhmm = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
function findTimeHTML() {
const ft = S.ft, people = [...ft.people].filter(id => team().some(m => m.id === id));
const from = ft.from || S.avDay || today(), to = ft.to && ft.to >= from ? ft.to : addDays(from, 4);
const noWork = people.filter(id => !S.patterns.some(x => x.member === id) && !S.plans.some(p => p.member === id && p.work_start));
let out = '';
if (people.length) {
const days = findSlots(people, from, to, ft.dur);
const groups = { ok: [], free: [] };
for (const { d, cells } of days) {
let run = null;
const flush = () => { if (run) groups[run.st].push(run); run = null; };
for (const c of cells) {
if (c.st === 'ok' || c.st === 'free') { if (run && run.st === c.st && c.a === run.last + FT_STEP) run.last = c.a; else { flush(); run = { d, st: c.st, first: c.a, last: c.a }; } }
else flush();
}
flush();
}
const cand = (r, k) => `<li><span><b>${md(r.d)} (${DOW[dowOf(r.d)]})</b> ${hhmm(r.first)}${r.last > r.first ? `~${hhmm(r.last)} 사이 시작` : ' 시작'} · ${fmtMin(ft.dur)}</span><button class="btn small" data-act="ft-make" data-id="${r.d}|${r.first}">일정 만들기</button></li>`;
const strip = days.map(({ d, cells }) => `<div class="ft-day"><span class="ft-d">${md(d)} ${DOW[dowOf(d)]}</span><div class="ft-cells">${cells.map(c => `<i class="ft-${c.st}" title="${hhmm(c.a)} 시작 · ${c.st === 'past' ? '지난 시간' : FT_ST[c.st][0]}${c.why ? ' — ' + esc(c.why) : ''}"></i>`).join('')}</div></div>`).join('');
out = `${noWork.length ? `<div class="notice"><p><b>${esc(noWork.map(nameOf).join(', '))}</b>님은 근무 가능 시간이 등록되지 않았어요. 그래서 ‘근무 가능 확인된 공통 시간’으로 확정 추천하지 않고, ‘일정 충돌 없음 · 근무 여부 미확인’으로만 보여 드려요.</p></div>` : ''}
<div class="ft-res"><div><div class="sec">${FT_ST.ok[0]} ${groups.ok.length}</div><ul class="ft-list">${groups.ok.slice(0, 8).map(r => cand(r)).join('') || '<li class="sub">없어요</li>'}</ul></div>
<div><div class="sec">${FT_ST.free[0]} ${groups.free.length}</div><ul class="ft-list">${groups.free.slice(0, 8).map(r => cand(r)).join('') || '<li class="sub">없어요</li>'}</ul></div></div>
<div class="ft-strip"><div class="ft-day ft-axis"><span class="ft-d"></span><div class="ft-cells">${Array.from({ length: (FT_B - FT_A) / 60 }, (_, k) => `<span style="left:${(k * 60 / (FT_B - FT_A) * 100).toFixed(2)}%">${FT_A / 60 + k}</span>`).join('')}</div></div>${strip}</div>
<div class="legend">${Object.entries(FT_ST).map(([k, v]) => `<span><i class="ft-${k}"></i>${v[0]}</span>`).join('')}</div>
<p class="sub">시간대만 확인된 일정(오전·오후 수업 등), 확인 필요 일정, 시간 미정 일정이 있는 날은 ‘판단 불가’예요. 종료 시간이 없는 일정은 시작 후 3시간까지 판단 불가로 봐요.</p>`;
} else out = '<p class="sub">참석자를 고르면 공통으로 비는 시간을 찾아 드려요.</p>';
return `<section class="sheet ft" aria-label="회의 시간 찾기"><div class="sec-title">Find a Time · 회의 시간 찾기<small>등록된 일정과 근무 시간만 비교해요</small></div>
<div class="ft-ctl"><div class="fl"><span>참석자</span>${team().map(m => `<button class="fchip" data-act="ft-person" data-id="${m.id}" aria-pressed="${ft.people.has(m.id)}">${avatar(m.id)}${esc(m.name)}</button>`).join('')}</div>
<div class="ft-row"><label class="f">시작 날짜<input type="date" id="ft-from" value="${from}"></label><label class="f">끝 날짜<input type="date" id="ft-to" value="${to}"></label>
<label class="f">회의 길이<select id="ft-dur">${[30, 60, 90, 120].map(n => `<option value="${n}" ${ft.dur === n ? 'selected' : ''}>${fmtMin(n)}</option>`).join('')}</select></label></div></div>
${out}</section>`;
}

else {

: d.confirm && e.virtual ? `<div class="notice alert"><p>어떤 일정을 삭제할까요? 지운 날은 다시 생기지 않아요.</p><button class="btn small danger" data-act="sr-del" data-id="one">${md(e.series_date)} 하루만</button><button class="btn small danger" data-act="sr-del" data-id="following">${md(e.series_date)}부터 앞으로 모두</button><button class="btn small danger" data-act="sr-del" data-id="all">반복 전체</button><button class="btn small" data-act="ev-status-no">아니요</button></div>`
: d.confirm ? `<div class="notice alert"><p>${e.status === 'active' ? '이 일정을 취소할까요? 기록은 남고, 관련 인물에게 알림이 가요.' : '취소한 일정을 다시 잡을까요?'}</p><button class="btn small danger" data-act="ev-status-yes">${e.status === 'active' ? '일정 취소' : '다시 잡기'}</button><button class="btn small" data-act="ev-status-no">아니요</button></div>`
: `<div class="actions"><button class="btn small" data-act="ev-edit">수정</button><button class="btn small" data-act="ev-status">${e.virtual ? '삭제' : e.status === 'active' ? '일정 취소' : '취소 되돌리기'}</button></div>`;
const att = e.attendance || {}, who = [...new Set([...e.participants, ...Object.keys(att)])];
const pList = who.map(p => { const a = att[p] || {}, s0 = a.s || (e.participants.includes(p) ? '' : 'declined'); return `<span>${avatar(p)}${esc(nameOf(p))}${s0 ? ` <span class="tag ${s0 === 'maybe' ? 'line' : 'c-' + ATT[s0][1]}">${ATT[s0][0]}</span>` : ''}${a.note ? ` <span class="sub">${esc(a.note)}</span>` : ''}</span>`; }).join('');
const tm = e.time_mode || (e.all_day ? 'all_day' : 'timed'), sc = scopeOf(e), seeAll = e.title != null;

<h2 style="font-size:20px;font-weight:640;line-height:1.35${e.status === 'cancelled' ? ';text-decoration:line-through' : ''}">${esc(evLabel(e))}</h2>

${e.version > 1 ? `<dt>마지막 수정</dt><dd>${esc(nameOf(e.updated_by))} · ${esc(stamp(e.updated_at))}</dd>` : ''}

function histHTML(h) {
if (h == null) return '<span>불러오는 중이에요.</span>';
if (!h.length) return '<span>기록이 없어요.</span>';
const fmt = x => x ? evRange({ start_at: x.start_at, end_at: x.end_at, all_day: x.all_day, time_mode: x.time_mode }) : '';
return h.map(c => {
let what = { created: '등록', cancelled: '취소', restored: '취소 되돌림' }[c.change_type] || '';
if (c.change_type === 'updated' && c.before && c.after) {
const parts = [];
if (c.before.start_at !== c.after.start_at || c.before.end_at !== c.after.end_at || c.before.all_day !== c.after.all_day || (c.before.time_mode || '') !== (c.after.time_mode || '')) parts.push(`시간 ${fmt(c.before)} → ${fmt(c.after)}`);
if (c.before.title !== c.after.title) parts.push(`제목 ‘${c.before.title}’ → ‘${c.after.title}’`);
if (c.before.category !== c.after.category) parts.push(`유형 ${ECAT[c.before.category]?.[0]} → ${ECAT[c.after.category]?.[0]}`);
if (c.before.visibility !== c.after.visibility) parts.push(`공개 범위 ${VIS[c.before.visibility]?.[0]} → ${VIS[c.after.visibility]?.[0]}`);
if ((c.before.participants || []).join() !== (c.after.participants || []).join()) parts.push(`관련 인물 ${(c.after.participants || []).map(nameOf).join(', ')}`);
if (c.before.note !== c.after.note) parts.push('메모 변경');
what = parts.join(' · ') || '변경';
}
return `<span>${esc(stamp(c.changed_at))} · ${esc(nameOf(c.actor))} · ${esc(what)}</span>`;
}).join('');
}

/* ---------- 영상 ---------- */
const BUCKET = 'issue-videos';
const videos = {
upload: async (issueId, file) => {
const ext = (file.name.split('.').pop() || 'mp4').replace(/[^a-z0-9]/gi, '').toLowerCase().slice(0, 8) || 'mp4';
const path = issueId + '/' + rid() + '.' + ext;
const { error } = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type, upsert: false });
if (error) throw error; return path;
},
url: async path => { const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 21600); if (error) throw error; return data.signedUrl; },
remove: async paths => { const { error } = await sb.storage.from(BUCKET).remove(paths); if (error) throw error; },
};
function attachVideos(playing) {
document.querySelectorAll('.vid-slot').forEach(slot => {
const path = slot.dataset.path; let box = vidCache[path];
if (!box) {
box = document.createElement('div');
const v = document.createElement('video'); v.controls = true; v.preload = 'metadata'; v.playsInline = true;
const fail = t => { box.textContent = ''; const d = document.createElement('div'); d.className = 'vid-err'; d.textContent = t; box.append(d); };
v.addEventListener('error', () => fail('이 브라우저에서 재생할 수 없는 영상이에요. MP4로 변환해 다시 올려 보세요.'));
box.append(v); vidCache[path] = box;
videos.url(path).then(u => { v.src = u; }).catch(() => fail('영상을 불러오지 못했어요. 페이지를 새로 열어 주세요.'));
}
slot.append(box);
});
playing.forEach(v => { if (v.isConnected) v.play().catch(() => {}); });
}
async function uploadVideo(file) {
if (!file) return;
if (!file.type.startsWith('video/')) { toast('영상 파일만 올릴 수 있어요.'); return; }
if (file.size > MAX_VIDEO) { toast(`50MB 이하의 영상만 올릴 수 있어요. 지금 파일은 ${(file.size / 1048576).toFixed(0)}MB예요.`); return; }
const id = curIssue; S.uploading = id; render();
try {
const path = await videos.upload(id, file);
const v = { path, name: file.name.slice(0, 120), size: file.size, type: file.type, by: S.me.id, at: new Date().toISOString() };
const cur = S.issues.find(x => x.id === id);
await write(() => docs.update('issues', id, { videos: [...((cur && cur.videos) || []), v] }), '영상을 올렸어요');
await loadDocs('issues');
} catch (e) { toast('영상을 올리지 못했어요. 파일과 인터넷 연결을 확인한 뒤 다시 시도하세요.'); }
S.uploading = null; render();
